<g filter="url(#shadow)"><ellipse cx="560" cy="238" rx="43" ry="46" fill="#1e161e"/><path d="M519 230c11-52 63-68 99-35-34-7-67 5-99 35z" fill="#040a13"/><path d="M508 282c30-38 85-50 125-20 39 29 54 76 50 142H466c2-54 13-92 42-122z" fill="url(#blue)"/><path d="M492 300c-38 28-65 63-82 101" stroke="#195c9b" stroke-width="28" stroke-linecap="round"/><path d="M633 305c36 18 65 48 80 81" stroke="#2176b9" stroke-width="27" stroke-linecap="round"/>
