<rect y="314" width="1600" height="116" fill="url(#floor)"/><path d="M0 352 1600 314v116H0z" fill="#020812" opacity=".78"/><ellipse cx="850" cy="355" rx="470" ry="50" fill="#2ceaff" opacity=".07" filter="url(#soft)"/><ellipse cx="1290" cy="372" rx="330" ry="52" fill="#ff43be" opacity=".08" filter="url(#soft)"/><path d="M90 420c330-38 592-1 882-29 232-23 410-59 628-39" fill="none" stroke="#29eaff" stroke-opacity=".28" stroke-width="4"/><path d="M278 429c379-30 667 0 920-32 166-21 274-40 402-34" fill="none" stroke="#ff46c4" stroke-opacity=".26" stroke-width="4"/>
