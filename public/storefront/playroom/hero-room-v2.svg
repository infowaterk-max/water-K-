 <!-- HUD --> <g opacity=".95"><rect x="589" y="51" width="129" height="28" rx="14" fill="#06182a" opacity=".88"/><circle cx="609" cy="65" r="7" fill="#42f4b8"/><path d="M626 65h67" stroke="#a6e8ff" stroke-width="5" stroke-linecap="round"/><rect x="1013" y="49" width="116" height="31" rx="15" fill="#101849" opacity=".9"/><circle cx="1035" cy="64" r="7" fill="#ff51c1"/><path d="M1052 64h55" stroke="#d4e7ff" stroke-width="4"/><path d="M1115 240h24v24h-24z" fill="none" stroke="#65efff" stroke-width="3"/><path d="m1127 234v36M1109 252h36" stroke="#65efff" stroke-width="2"/></g>
 <!-- screen reflection --> <path d="M577 42 740 42 593 285h-17z" fill="#fff" opacity=".055"/></g>
<!-- neon sign -->
<g filter="url(#shadow)"><rect x="1212" y="32" width="210" height="190" rx="16" fill="#0b0616" stroke="#833bff" stroke-width="3"/><text x="1317" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-style="italic" font-weight="800" fill="#ff59d1" filter="url(#glow)">Good Games</text><text x="1317" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-style="italic" font-weight="800" fill="#ff59d1" filter="url(#glow)">Brighter</text><text x="1317" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-style="italic" font-weight="800" fill="#ff59d1" filter="url(#glow)">People</text><path d="M1254 185c18-30 43-30 61 0 18 29 40 29 59 0" fill="none" stroke="#43edff" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/></g>
