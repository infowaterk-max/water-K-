 <rect x="54" y="144" width="109" height="43" rx="5" fill="#0d2340"/><path d="M66 178l28-28 22 19 25-15 13 24z" fill="#3979ed"/><rect x="183" y="142" width="80" height="46" rx="5" fill="#371342"/><circle cx="223" cy="165" r="14" fill="#f84ebd"/><rect x="282" y="144" width="90" height="43" rx="5" fill="#0d3548"/><path d="M298 166h56" stroke="#45ead3" stroke-width="5"/>
 <rect x="54" y="218" width="98" height="39" rx="5" fill="#141e35"/><path d="M68 239h69" stroke="#ffa14c" stroke-width="5"/><rect x="170" y="216" width="96" height="41" rx="5" fill="#0e213a"/><circle cx="218" cy="236" r="13" fill="#46eaff" opacity=".52"/><rect x="283" y="218" width="90" height="39" rx="5" fill="#21163f"/><path d="M300 246l25-26 24 26" fill="none" stroke="#a969ff" stroke-width="5"/></g>
