<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 430" role="img" aria-labelledby="title desc">
<title id="title">Neon gamer room with friends</title><desc id="desc">Original cinematic neon gaming room with three friends on a sofa, an adventure game screen, shelves, posters, plants and cyan-magenta ambient light.</desc>
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03101f"/><stop offset=".4" stop-color="#101849"/><stop offset="1" stop-color="#390c47"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0c1830"/><stop offset="1" stop-color="#020711"/></linearGradient>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27dff4"/><stop offset=".42" stop-color="#4388f3"/><stop offset=".74" stop-color="#7550f2"/><stop offset="1" stop-color="#ef4aa9"/></linearGradient>
 <linearGradient id="mount" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#0d3d72"/><stop offset="1" stop-color="#36cbe5"/></linearGradient>
 <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#315b80"/><stop offset=".42" stop-color="#172f4e"/><stop offset="1" stop-color="#071225"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3199e9"/><stop offset=".58" stop-color="#1761a6"/><stop offset="1" stop-color="#0a315d"/></linearGradient>
 <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d14eae"/><stop offset=".55" stop-color="#87366f"/><stop offset="1" stop-color="#441b4f"/></linearGradient>
 <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ce673f"/><stop offset=".55" stop-color="#873b27"/><stop offset="1" stop-color="#411a18"/></linearGradient>
 <radialGradient id="cg"><stop stop-color="#2ceaff" stop-opacity=".78"/><stop offset="1" stop-color="#2ceaff" stop-opacity="0"/></radialGradient>
 <radialGradient id="pg"><stop stop-color="#ff3fc2" stop-opacity=".72"/><stop offset="1" stop-color="#ff3fc2" stop-opacity="0"/></radialGradient>
 <radialGradient id="vg"><stop stop-color="#7955ff" stop-opacity=".6"/><stop offset="1" stop-color="#7955ff" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="25"/></filter><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#000" flood-opacity=".58"/></filter><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="11"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
</defs>
