<g><path d="M1450 264c-7-39 12-75 50-98-3 35-14 69-38 99 28-27 53-36 72-29-10 27-30 46-59 51z" fill="#17605a"/><rect x="1441" y="280" width="72" height="50" rx="8" fill="#10243c"/><path d="M1455 289h43" stroke="#39eaff" stroke-width="4"/><rect x="1535" y="202" width="20" height="105" rx="10" fill="#18142b"/><path d="M1545 211v88" stroke="#ff48c7" stroke-width="7" filter="url(#glow)"/><rect x="1494" y="216" width="19" height="92" rx="9" fill="#10283f"/><path d="M1503 225v75" stroke="#35eaff" stroke-width="7" filter="url(#glow)"/></g>
