<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 430" role="img" aria-labelledby="title desc">
<title id="title">Cinematic neon gaming room</title><desc id="desc">Original cinematic gaming-room artwork with three players on a sofa, vivid gameplay, RGB shelves, neon signage and layered cyan-magenta lighting.</desc>
<defs>
 <linearGradient id="wall" x2="1" y2="1"><stop stop-color="#020812"/><stop offset=".34" stop-color="#09162e"/><stop offset=".68" stop-color="#241250"/><stop offset="1" stop-color="#4c0d51"/></linearGradient>
 <linearGradient id="floor" y2="1"><stop stop-color="#101a31"/><stop offset="1" stop-color="#02050c"/></linearGradient>
 <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#08d9f1"/><stop offset=".35" stop-color="#246cf0"/><stop offset=".72" stop-color="#7651ee"/><stop offset="1" stop-color="#ff459f"/></linearGradient>
 <linearGradient id="city" y2="1"><stop stop-color="#163a69"/><stop offset="1" stop-color="#061127"/></linearGradient>
 <linearGradient id="sofa" y2="1"><stop stop-color="#355f83"/><stop offset=".4" stop-color="#19344f"/><stop offset="1" stop-color="#071120"/></linearGradient>
 <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#36a5ef"/><stop offset=".55" stop-color="#1763aa"/><stop offset="1" stop-color="#082949"/></linearGradient>
 <linearGradient id="pink" x2="1" y2="1"><stop stop-color="#ee55bd"/><stop offset=".54" stop-color="#9d397f"/><stop offset="1" stop-color="#44183f"/></linearGradient>
 <linearGradient id="orange" x2="1" y2="1"><stop stop-color="#f57b45"/><stop offset=".55" stop-color="#a33e28"/><stop offset="1" stop-color="#431813"/></linearGradient>
 <radialGradient id="cyan"><stop stop-color="#29edff" stop-opacity=".9"/><stop offset="1" stop-color="#29edff" stop-opacity="0"/></radialGradient>
 <radialGradient id="mag"><stop stop-color="#ff43bd" stop-opacity=".8"/><stop offset="1" stop-color="#ff43bd" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".68"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="19"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .075"/></feComponentTransfer></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="1600" height="430" fill="url(#wall)"/>
<ellipse cx="825" cy="145" rx="600" ry="300" fill="url(#cyan)" filter="url(#blur)" opacity=".36"/><ellipse cx="1390" cy="130" rx="360" ry="250" fill="url(#mag)" filter="url(#blur)" opacity=".68"/>
<!-- RGB display wall -->
<g filter="url(#shadow)"><rect x="18" y="24" width="392" height="252" rx="14" fill="#030a13" stroke="#16405c" stroke-width="3"/><path d="M38 52h350M38 126h350M38 202h350" stroke="#1f435f" stroke-width="4"/><path d="M37 49h351" stroke="#2beaff" stroke-width="5" filter="url(#glow)"/><path d="M388 52v202" stroke="#ff43bf" stroke-width="5" filter="url(#glow)"/>
