<g filter="url(#shadow)"><rect x="548" y="15" width="628" height="295" rx="20" fill="#01050d" stroke="#50efff" stroke-width="7" filter="url(#glow)"/><rect x="566" y="33" width="592" height="259" rx="11" fill="url(#screen)"/>
 <!-- gameplay sky / planet --> <circle cx="1020" cy="82" r="38" fill="#ffe060"/><circle cx="1032" cy="70" r="15" fill="#fff3a2" opacity=".72"/>
