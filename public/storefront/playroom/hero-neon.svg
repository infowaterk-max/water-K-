<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Neon gaming hero scene</title><desc id="desc">A stylized midnight gaming room with a glowing controller, portal ring, pedestal, plants and abstract neon symbols.</desc>
