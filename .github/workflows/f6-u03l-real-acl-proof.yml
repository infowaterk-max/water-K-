name: F6-U03l genuine Docker PG17 immutable release-candidate v2-v3 final ACL proof
on:
  push:
    branches:
      - feature/core-1186-f6-u03l-ordered-release-candidate-acl
    paths:
      - scripts/shoperation-f6-u03l-release-candidate-acl.mjs
      - tests/shoperation-f6-u03l-release-candidate-acl.test.ts
      - .github/workflows/f6-u03l-real-acl-proof.yml
      - docs/po/CORE_1186_F6_U03L_SOURCE_CANDIDATE_ACL_2026-10-16.md
      - quality/development/active-plan.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-local-final-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f6-u03l-local-only
          POSTGRES_DB: f6_u03i_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d f6_u03i_fresh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked project dependencies and real PG client
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Verify all 78 original Git blobs and emit review-candidate only
        run: |
          node scripts/shoperation-f6-u03k-office-local-replay.mjs --emit-bundle artifacts/f6-u03k/local-77
          node scripts/shoperation-f6-u03l-release-candidate-acl.mjs --emit-candidate artifacts/f6-u03l/review-candidate-v0
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {checkCandidateManifest} from './scripts/shoperation-f6-u03l-release-candidate-acl.mjs';
          const m=JSON.parse(readFileSync('artifacts/f6-u03l/review-candidate-v0/ordered-candidate-v0.1.json','utf8'));
          if(checkCandidateManifest(m)!==true||m.releaseAuthorized!==false||
             m.hostedTouched!==false||m.sources.length!==78||
             m.sources.filter(x=>x.authority==='original-main-office-history').length!==19)
            throw Error('F6U03L_UNVERIFIED_OR_HOSTED_CANDIDATE');
          console.log('Verified 78 unchanged original sources. Manifest review ONLY.');
          NODE
      - name: Adversarial source order and ACL negative tests
        run: npx vitest run tests/shoperation-f6-u03l-release-candidate-acl.test.ts
      - name: Verify exact Docker PG17 role, database, peer and no external SQL selectors
        shell: bash
        env:
          PGPASSWORD: f6-u03l-local-only
          PG17_CONTAINER: ${{ job.services.pg17.id }}
        run: |
          for n in PGHOST PGHOSTADDR PGSERVICE PGSERVICEFILE PGDATABASE PGOPTIONS DATABASE_URL SUPABASE_DB_URL SHOPERATION_FRESH_INSTALL_DB_URL; do
            if printenv "$n" >/dev/null 2>&1; then echo "F6U03L_FORBIDDEN_SELECTOR=$n" >&2; exit 1; fi
          done
          test -n "$PG17_CONTAINER"
          peer="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$PG17_CONTAINER")"
          test -n "$peer"
          actual="$(psql -XAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d f6_u03i_fresh -c "select host(inet_server_addr())||'|'||current_database()||'|'||current_user||'|'||current_setting('server_version_num')")"
          case "$actual" in "$peer|f6_u03i_fresh|postgres|17"????) echo 'Verified independent disposable PostgreSQL17 peer';; *) echo 'F6U03L_WRONG_DOCKER_TARGET' >&2; exit 1;; esac
      - name: Bootstrap only previously proven provider fixture shell
        env:
          PGPASSWORD: f6-u03l-local-only
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d f6_u03i_fresh -f artifacts/f6-u03k/local-77/bootstrap-fresh.sql >artifacts/f6-u03l/review-candidate-v0/bootstrap.log
      - name: Commit all 78 original SQL and genuine original preflight-postflight
        env:
          PGPASSWORD: f6-u03l-local-only
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d f6_u03i_fresh -f artifacts/f6-u03k/local-77/commit.sql >artifacts/f6-u03l/review-candidate-v0/commit.log 2>artifacts/f6-u03l/review-candidate-v0/commit.err
          grep -F 'target-preflight-ok' artifacts/f6-u03l/review-candidate-v0/commit.log
          grep -F 'target-postflight-ok' artifacts/f6-u03l/review-candidate-v0/commit.log
          tail -1 artifacts/f6-u03l/review-candidate-v0/commit.log | grep -Fx 'COMMIT'
      - name: Query actual effective grants for exact legacy v2 and current v3 functions
        env:
          PGPASSWORD: f6-u03l-local-only
        run: |
          psql -XAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d f6_u03i_fresh -f artifacts/f6-u03l/review-candidate-v0/final-acl-readonly.sql >artifacts/f6-u03l/review-candidate-v0/native-acl.json 2>artifacts/f6-u03l/review-candidate-v0/native-acl.err
          psql -XAt -F '|' -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d f6_u03i_fresh -c "select (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p')),(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'),(select count(*) from pg_policy p join pg_class c on c.oid=p.polrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public')" >artifacts/f6-u03l/review-candidate-v0/persisted-counts.txt
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {validateFinalAcl} from './scripts/shoperation-f6-u03l-release-candidate-acl.mjs';
          const folder='artifacts/f6-u03l/review-candidate-v0/';
          const native=JSON.parse(readFileSync(folder+'native-acl.json','utf8'));
          const out=validateFinalAcl(native);
          const counts=readFileSync(folder+'persisted-counts.txt','utf8').trim().split('|').map(Number);
          if(counts.length!==3||counts[0]<190||counts[1]<379||counts[2]<129)
            throw Error('F6U03L_COMMITTED_ORIGINAL_SCHEMA_NOT_PERSISTED');
          writeFileSync(folder+'acl-proof.json',JSON.stringify({...out,counts,sourceCount:78},null,2));
          console.log(JSON.stringify({...out,counts,sourceCount:78},null,2));
          NODE
      - name: Preserve source identity, genuine SQL and final ACL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f6-u03l-source-review-and-native-acl-${{ github.sha }}
          path: |
            artifacts/f6-u03l/review-candidate-v0/ordered-candidate-v0.1.json
            artifacts/f6-u03l/review-candidate-v0/final-acl-readonly.sql
            artifacts/f6-u03l/review-candidate-v0/bootstrap.log
            artifacts/f6-u03l/review-candidate-v0/commit.log
            artifacts/f6-u03l/review-candidate-v0/commit.err
            artifacts/f6-u03l/review-candidate-v0/native-acl.json
            artifacts/f6-u03l/review-candidate-v0/native-acl.err
            artifacts/f6-u03l/review-candidate-v0/persisted-counts.txt
            artifacts/f6-u03l/review-candidate-v0/acl-proof.json
          retention-days: 14
          if-no-files-found: warn
