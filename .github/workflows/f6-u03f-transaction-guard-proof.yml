name: F6-U03f fail-closed transaction guard (local PostgreSQL17 only)
on:
  push:
    branches:
      - feature/core-1186-f6-u03f-transaction-local-guard
    paths:
      - .github/workflows/f6-u03f-transaction-guard-proof.yml
      - .github/workflows/f6-u03-canonical-plan-capture.yml
      - scripts/shoperation-f6-u03f-target-transaction-guard.mjs
      - scripts/shoperation-fresh-disposable-reprovision.mjs
      - tests/shoperation-f6-u03f-target-transaction-guard.test.ts
      - docs/po/CORE_1186_F6_U03F_TRANSACTION_GUARD_2026-10-15.md
      - quality/development/active-plan.json

permissions:
  contents: read

jobs:
  fixture-negative-proof:
    name: Reject mismatched schema in truly isolated PostgreSQL17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f6-u03f-local-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Checkout full source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install local PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Prepare standalone, deliberately nonmatching PG fixture
        shell: bash
        run: |
          export PGPASSWORD='f6-u03f-local-only'
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d postgres -c "CREATE TABLE public.f6u03f_sentinel(id integer PRIMARY KEY); INSERT INTO public.f6u03f_sentinel VALUES(7);"
      - name: Compile exact 59-file guarded SQL REVIEW and demand fail-before-DROP
        shell: bash
        run: |
          mkdir -p artifacts/f6-u03f
          node --input-type=module <<'NODE'
          import{writeFileSync}from'node:fs';
          import{compileAtomicReview}from'./scripts/shoperation-fresh-disposable-reprovision.mjs';
          const review=compileAtomicReview(process.cwd());
          if(review.executionEnabled!==false||review.migrationCount!==59
           ||review.transactionGuard.projectTLSIdentityProven!==false
           ||review.transactionGuard.liveTransactionalGuardProven!==false
           ||review.sql.indexOf('DO $f6_guard$')<0
           ||review.sql.indexOf('FRESH_REPROVISION_HOSTED_EXECUTION_NOT_AUTHORIZED')<review.sql.indexOf('DO $f6_guard$')
           ||review.sql.indexOf('DROP SCHEMA private CASCADE;')<review.sql.indexOf('FRESH_REPROVISION_HOSTED_EXECUTION_NOT_AUTHORIZED'))
           throw Error('F6U03F_GUARD_OR_ABORT_ORDER_INVALID');
          writeFileSync('/tmp/f6-u03f-review.sql',review.sql);
          writeFileSync('artifacts/f6-u03f/source-review.json',JSON.stringify({
           decision:'SOURCE_ONLY',scope:review.transactionGuard.scope,
           sourceSetSha256:review.sourceSetSha256,sqlSha256:review.sqlSha256,
           migrationsApplied:0,hostedResetAuthorized:false,providerProof:false
          },null,2));
          NODE
          export PGPASSWORD='f6-u03f-local-only'
          set +e
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d postgres -f /tmp/f6-u03f-review.sql >/tmp/f6-u03f-stdout 2>/tmp/f6-u03f-error
          exitcode=$?
          set -e
          test "$exitcode" -ne 0
          grep -F 'F6U03F_APP_RELATION_SET_CHANGED' /tmp/f6-u03f-error >/dev/null
          test "$(psql -X -At -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c 'SELECT count(*) FROM public.f6u03f_sentinel WHERE id=7')" = 1
          echo 'F6-U03f local PostgreSQL17 fail-closed before any DROP; original row preserved.'
      - name: Publish limited no-cloud fixture proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f6-u03f-transaction-guard-${{ github.sha }}
          path: artifacts/f6-u03f/source-review.json
          if-no-files-found: warn
          retention-days: 30
