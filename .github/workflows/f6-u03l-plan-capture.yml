name: F6-U03l critical original-source candidate and ACL plan capture
on:
  push:
    branches:
      - feature/core-1186-f6-u03l-ordered-release-candidate-acl
    paths:
      - .github/workflows/f6-u03l-plan-capture.yml
      - quality/development/active-plan.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Generate canonical critical Development Guard
        run: |
          node scripts/shoperation-development-guard.mjs \
            --task "Core #1186 F6-U03l: pin 78-source ordered release candidate manifest and prove legacy inbound v2/v3 final PostgreSQL17 EXECUTE privileges" \
            --files "scripts/shoperation-f6-u03l-release-candidate-acl.mjs;tests/shoperation-f6-u03l-release-candidate-acl.test.ts;.github/workflows/f6-u03l-real-acl-proof.yml;.github/workflows/f6-u03l-plan-capture.yml;docs/po/CORE_1186_F6_U03L_SOURCE_CANDIDATE_ACL_2026-10-16.md;quality/development/active-plan.json" \
            --risk critical \
            --source-ref "https://github.com/infowaterk-max/water-K-/issues/1228" \
            --write-plan --check
      - name: Emit original source-only plan in logs for governance review
        if: always()
        run: |
          cat artifacts/shoperation-development-guard/development-guard.md || :
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          if(existsSync('quality/development/active-plan.json')){
            const s=readFileSync('quality/development/active-plan.json').toString('base64');
            for(let i=0;i<s.length;i+=1200)console.log('F6U03L_PLAN='+s.slice(i,i+1200));
          }
          NODE
      - name: Upload canonical Development Guard and plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f6-u03l-source-acl-plan-${{ github.sha }}
          path: |
            quality/development/active-plan.json
            artifacts/shoperation-development-guard/development-guard.md
            artifacts/shoperation-development-guard/development-guard.json
          retention-days: 7
