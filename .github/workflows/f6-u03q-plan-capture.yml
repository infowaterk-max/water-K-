name: F6-U03q managed Supabase provider readiness plan
on:
  push:
    branches: [feature/core-1186-f6-u03q-managed-api-preflight]
    paths:
      - .github/workflows/f6-u03q-plan-capture.yml
      - quality/development/active-plan.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Enforce critical Plan Before Code on committed plan
        run: node scripts/shoperation-plan-before-code.mjs --check
      - name: Generate original Development Guard and critical bounded plan
        run: |
          node scripts/shoperation-development-guard.mjs \
            --task "Core #1186 F6-U03q read-only managed Supabase Office Auth/Data API readiness and honest proof provenance" \
            --files "scripts/shoperation-f6-u03q-managed-preflight.mjs;tests/shoperation-f6-u03q-managed-preflight.test.ts;.github/workflows/f6-u03q-plan-capture.yml;docs/po/CORE_1186_F6_U03Q_MANAGED_PREFLIGHT_2026-10-16.md;quality/development/active-plan.json" \
            --risk critical \
            --source-ref "https://github.com/infowaterk-max/water-K-/issues/1228" \
            --write-plan --check
      - name: Review full active Known Failures and unmodified draft plan
        if: always()
        run: |
          cat artifacts/shoperation-development-guard/development-guard.md || :
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          if(existsSync('quality/development/active-plan.json')){
            const s=readFileSync('quality/development/active-plan.json').toString('base64');
            for(let i=0;i<s.length;i+=1200)console.log('F6U03Q_PLAN='+s.slice(i,i+1200));
          }
          NODE
      - name: Preserve canonical pre-implementation Development Guard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f6-u03q-original-plan-${{ github.sha }}
          path: |
            quality/development/active-plan.json
            artifacts/shoperation-development-guard/development-guard.md
            artifacts/shoperation-development-guard/development-guard.json
          retention-days: 7
