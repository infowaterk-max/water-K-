name: F6-U03v Office independent readonly fixture and role-state proof
on:
  push:
    branches: [feature/core-1186-f6-u03v-fixture-lineage]
    paths:
      - .github/workflows/f6-u03v-fixture-lineage-proof.yml
      - scripts/shoperation-f6-u03v-fixture-lineage.mjs
      - tests/shoperation-f6-u03v-fixture-lineage.test.ts
      - docs/po/CORE_1186_F6_U03V_READONLY_FIXTURE_STATE_2026-10-17.md
      - quality/development/active-plan.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci --no-audit --no-fund
      - name: Critical Development Guard
        run: |
          node scripts/shoperation-development-guard.mjs \
            --task "Core #1186 F6-U03v independent read-only provider fixture existence, Alap/Pro plan and revoked role state verification; no hosted writes or fake signed-JWT acceptance." \
            --files ".github/workflows/f6-u03v-fixture-lineage-proof.yml;scripts/shoperation-f6-u03v-fixture-lineage.mjs;tests/shoperation-f6-u03v-fixture-lineage.test.ts;docs/po/CORE_1186_F6_U03V_READONLY_FIXTURE_STATE_2026-10-17.md;quality/development/active-plan.json" \
            --risk critical \
            --source-ref "https://github.com/infowaterk-max/water-K-/issues/1186" \
            --check
      - name: Critical Plan Before Code
        run: node scripts/shoperation-plan-before-code.mjs --check
      - name: Verify read-only state contract and run positive negative fault injection
        run: |
          node --check scripts/shoperation-f6-u03v-fixture-lineage.mjs
          npx vitest run tests/shoperation-f6-u03v-fixture-lineage.test.ts
          node scripts/shoperation-f6-u03v-fixture-lineage.mjs --preflight
          node scripts/shoperation-f6-u03v-fixture-lineage.mjs --emit-prerequisites artifacts/f6-u03v/fixture-state
          test -s artifacts/f6-u03v/fixture-state/prerequisites-readonly.sql
      - name: Publish only metadata prerequisite SQL, never owner UUID fixture data
        uses: actions/upload-artifact@v4
        with:
          name: f6-u03v-readonly-prerequisites
          path: artifacts/f6-u03v/fixture-state/prerequisites-readonly.sql
          if-no-files-found: error
          retention-days: 14
