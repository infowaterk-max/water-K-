name: F6-U03i real isolated PostgreSQL17 59-file atomic baseline and rollback
on:
  push:
    branches:
      - feature/core-1186-f6-u03i-local-59-migration-replay
    paths:
      - scripts/shoperation-f6-u03i-local-59-proof.mjs
      - tests/shoperation-f6-u03i-local-59-proof.test.ts
      - .github/workflows/f6-u03i-local-59-proof.yml
      - quality/development/active-plan.json
      - docs/po/CORE_1186_F6_U03I_LOCAL_59_PROOF_2026-10-15.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      fresh:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f6-u03i-local-only
          POSTGRES_DB: f6_u03i_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d f6_u03i_fresh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      abort:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f6-u03i-local-only
          POSTGRES_DB: f6_u03i_abort
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d f6_u03i_abort"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install exact PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Compile authentic 59 source-reviewed SQL, without network execution
        run: |
          node scripts/shoperation-f6-u03i-local-59-proof.mjs --emit-bundle artifacts/f6-u03i/local-59
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync('artifacts/f6-u03i/local-59/manifest.json','utf8'));
          if(m.commit.sourceCount!==59||m.rollback.sourceCount!==59||
            m.commit.sourceSetSha256!==m.rollback.sourceSetSha256||
            m.commit.sqlSha256===m.rollback.sqlSha256||
            m.commit.hostedExecutionEnabled!==false||m.rollback.hostedExecutionEnabled!==false)
            throw Error('F6U03I_UNREVIEWED_OR_FAKE_MANIFEST');
          console.log('Both independent transaction bundles use exactly 59 approved immutable sources');
          NODE
      - name: Verify both real Docker PG17 peers and all inherited libpq selectors
        shell: bash
        env:
          PGPASSWORD: f6-u03i-local-only
          FRESH_CONTAINER: ${{ job.services.fresh.id }}
          ABORT_CONTAINER: ${{ job.services.abort.id }}
        run: |
          for name in PGHOST PGHOSTADDR PGSERVICE PGSERVICEFILE PGDATABASE PGOPTIONS DATABASE_URL SUPABASE_DB_URL SHOPERATION_FRESH_INSTALL_DB_URL; do
            if printenv "$name" >/dev/null 2>&1; then echo "F6U03I_REDIRECT_SELECTOR=$name" >&2; exit 1; fi
          done
          test -n "$FRESH_CONTAINER"
          test -n "$ABORT_CONTAINER"
          test "$FRESH_CONTAINER" != "$ABORT_CONTAINER"
          for target in "5432|f6_u03i_fresh|$FRESH_CONTAINER" "5433|f6_u03i_abort|$ABORT_CONTAINER"; do
            IFS='|' read -r port name container <<< "$target"
            expected="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$container")"
            test -n "$expected"
            actual="$(psql -XAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -p "$port" -U postgres -d "$name" -c "select host(inet_server_addr())||'|'||current_database()||'|'||current_user||'|'||current_setting('server_version_num')")"
            case "$actual" in "$expected|$name|postgres|17"????) echo "Verified local Docker PG17 $name";; *) echo "F6U03I_REAL_DOCKER_IDENTITY_FAILED" >&2; exit 1;; esac
          done
      - name: Bootstrap independently isolated provider fixture shells
        env:
          PGPASSWORD: f6-u03i-local-only
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d f6_u03i_fresh -f artifacts/f6-u03i/local-59/bootstrap-fresh.sql >artifacts/f6-u03i/local-59/bootstrap-fresh.log
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5433 -U postgres -d f6_u03i_abort -f artifacts/f6-u03i/local-59/bootstrap-abort.sql >artifacts/f6-u03i/local-59/bootstrap-abort.log
      - name: Execute original target preflight plus all 59 SQL files, seed and postflight atomically
        env:
          PGPASSWORD: f6-u03i-local-only
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d f6_u03i_fresh -f artifacts/f6-u03i/local-59/commit.sql >artifacts/f6-u03i/local-59/commit.log 2>artifacts/f6-u03i/local-59/commit.err
          grep -F 'target-preflight-ok' artifacts/f6-u03i/local-59/commit.log
          grep -F 'target-postflight-ok' artifacts/f6-u03i/local-59/commit.log
          tail -1 artifacts/f6-u03i/local-59/commit.log | grep -Fx 'COMMIT'
      - name: Independently confirm committed application schema was retained
        env:
          PGPASSWORD: f6-u03i-local-only
        run: |
          psql -XAt -F '|' -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d f6_u03i_fresh -c "select (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p')),(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'),(select count(*) from pg_policy p join pg_class c on c.oid=p.polrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public'), (to_regprocedure('private.office_effective_feature_enabled_v1(uuid,text)') is not null)::int" >artifacts/f6-u03i/local-59/persisted-objects.txt
          node --input-type=module <<'NODE'
          import{readFileSync,writeFileSync}from'node:fs';
          import{validateIsolatedObservation}from'./scripts/shoperation-f6-u03i-local-59-proof.mjs';
          const m=JSON.parse(readFileSync('artifacts/f6-u03i/local-59/manifest.json','utf8')).commit;
          const raw=readFileSync('artifacts/f6-u03i/local-59/persisted-objects.txt','utf8').trim();
          const fields=raw.split('|').map(Number);
          if(fields.length!==4||fields[3]!==1)throw Error('F6U03I_FINAL_OFFICE_FUNCTION_MISSING');
          const proof=validateIsolatedObservation({manifest:m,realPg17:true,originalSqlCompleted:true,
            positivePostflight:true,appTables:fields[0],appFunctions:fields[1],appPolicies:fields[2]});
          writeFileSync('artifacts/f6-u03i/local-59/positive-proof.json',JSON.stringify({...proof,tables:fields[0],functions:fields[1],policies:fields[2]},null,2));
          console.log(JSON.stringify(proof));
          NODE
      - name: Inject fault before COMMIT on separate clean PG17, assert transaction rollback
        env:
          PGPASSWORD: f6-u03i-local-only
        shell: bash
        run: |
          set +e
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5433 -U postgres -d f6_u03i_abort -f artifacts/f6-u03i/local-59/rollback.sql >artifacts/f6-u03i/local-59/rollback.log 2>artifacts/f6-u03i/local-59/rollback.err
          exit_status=$?
          set -e
          test "$exit_status" -ne 0 || { echo F6U03I_FAULT_NOT_TRIGGERED; exit 1; }
          grep -F 'target-postflight-ok' artifacts/f6-u03i/local-59/rollback.log
          grep -F 'F6U03I_INJECTED_ABORT_BEFORE_COMMIT' artifacts/f6-u03i/local-59/rollback.err
          psql -XAt -F '|' -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5433 -U postgres -d f6_u03i_abort -c "select (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname in ('public','private') and c.relkind in ('r','p','v','m')),(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname in ('public','private')),(select count(*) from pg_policy p join pg_class c on c.oid=p.polrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname in ('public','private'))" >artifacts/f6-u03i/local-59/rollback-counts.txt
          node --input-type=module <<'NODE'
          import{readFileSync,writeFileSync}from'node:fs';
          import{validateIsolatedObservation}from'./scripts/shoperation-f6-u03i-local-59-proof.mjs';
          const m=JSON.parse(readFileSync('artifacts/f6-u03i/local-59/manifest.json','utf8')).rollback;
          const counts=readFileSync('artifacts/f6-u03i/local-59/rollback-counts.txt','utf8').trim().split('|').map(Number);
          if(counts.length!==3)throw Error('F6U03I_INVALID_ROLLBACK_DB_CHECK');
          const proof=validateIsolatedObservation({manifest:m,realPg17:true,originalSqlCompleted:false,
            transactionRolledBack:true,appTables:counts[0],appFunctions:counts[1],appPolicies:counts[2]});
          writeFileSync('artifacts/f6-u03i/local-59/rollback-proof.json',JSON.stringify({...proof,remainingCounts:counts},null,2));
          console.log(JSON.stringify(proof));
          NODE
      - name: Preserve raw SQL execution evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f6-u03i-local-59-atomic-and-rollback-${{ github.sha }}
          path: |
            artifacts/f6-u03i/local-59/manifest.json
            artifacts/f6-u03i/local-59/commit.log
            artifacts/f6-u03i/local-59/commit.err
            artifacts/f6-u03i/local-59/rollback.log
            artifacts/f6-u03i/local-59/rollback.err
            artifacts/f6-u03i/local-59/persisted-objects.txt
            artifacts/f6-u03i/local-59/rollback-counts.txt
            artifacts/f6-u03i/local-59/positive-proof.json
            artifacts/f6-u03i/local-59/rollback-proof.json
          retention-days: 14
          if-no-files-found: warn
