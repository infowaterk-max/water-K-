name: Temporary Playroom v20 localization refresh proof

on:
  push:
    branches:
      - feature/playroom-v20-functional-acceptance
    paths:
      - src/app/api/internal/playroom-v20-localization-refresh/route.ts
      - .github/workflows/playroom-v20-localization-refresh-proof.yml

permissions:
  contents: read

jobs:
  prove:
    if: github.event.head_commit.message == '[acceptance] Run exact deployment localization refresh proof'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://water-k-native-73cankymn-infowaterk-5067.vercel.app
      PROOF_SHA: e0e757ff97afea808aa7acc95b43e706dc8c7803
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Verify Vercel automation bypass secret
        shell: bash
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET repository secret is missing." >&2
            exit 1
          fi

      - name: Run exact-head Playroom localization refresh
        shell: bash
        run: |
          set -euo pipefail
          rm -f response.json
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error               --output response.json               --write-out '%{http_code}'               --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"               --header "x-shoperation-acceptance-proof: $PROOF_SHA"               "$BASE_URL/api/internal/playroom-v20-localization-refresh")"

            if [ "$status" = "200" ]; then break; fi
            if [ "$status" = "500" ] || [ "$status" = "409" ]; then
              echo "Localization refresh endpoint returned HTTP $status." >&2
              cat response.json >&2 || true
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Localization refresh endpoint did not become ready for exact SHA $PROOF_SHA; last HTTP $status." >&2
              cat response.json >&2 || true
              exit 1
            fi
            sleep 10
          done

          node <<'NODE'
          const fs=require('node:fs');
          const value=JSON.parse(fs.readFileSync('response.json','utf8'));
          const e=value?.evidence;
          const r=e?.refresh;
          const before=r?.revisionsBefore;
          const after=r?.revisionsAfter;
          const required=[
            value?.ok===true,
            e?.commit===process.env.PROOF_SHA,
            e?.environment==='preview-staging',
            e?.tenant?.id==='6027c79a-e5f3-4c9c-a8d0-b6090958efde',
            e?.tenant?.plan==='alap',
            e?.tenant?.status==='pilot',
            r?.mode==='refresh',
            r?.pageCount===14,
            Array.isArray(r?.pageKeys)&&r.pageKeys.length===14,
            Array.isArray(before)&&before.length===14,
            Array.isArray(after)&&after.length===14,
            after?.every((x,i)=>x===before[i]+1)===true,
            r?.revisionStepOk===true,
            r?.exactDocuments===true,
            r?.allV20===true,
            r?.publishedCount===0,
            r?.mutationScope==='storefront_page_drafts_only',
            e?.boundary?.unchanged===true,
          ];
          if(required.some(result=>result!==true)){
            console.error(JSON.stringify(value,null,2));
            throw new Error('PLAYROOM_LOCALIZATION_REFRESH_EVIDENCE_INVALID');
          }
          console.log(JSON.stringify(value,null,2));
          NODE

      - name: Record localization refresh evidence
        if: success()
        shell: bash
        run: |
          {
            echo '## Playroom v20 localization refresh'
            echo ''
            echo "- Source commit: $PROOF_SHA"
            echo '- Environment: protected Vercel Preview -> staging Supabase'
            echo '- Mode: refresh'
            echo '- 14/14 persisted draft pages: exact current localized documents'
            echo '- Revision step: +1 on every page'
            echo '- Published pages: 0'
            echo '- Mutation scope: storefront_page_drafts_only'
            echo '- Product/order identity boundary: unchanged'
            echo '- Production: untouched'
          } >> "$GITHUB_STEP_SUMMARY"
