name: Template Golden Baseline Promotion

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: Successful Template Factory Quality Gate v2 run ID
        required: true
        type: string
      source_ref:
        description: Exact source ref whose evidence is being promoted
        required: true
        type: string
      template_key:
        description: Template key
        required: true
        type: string
      template_version:
        description: Template version
        required: true
        type: string
      baseline_directory:
        description: Repository baseline directory
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact acceptance source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Download exact quality evidence
        uses: actions/download-artifact@v4
        with:
          pattern: template-factory-quality-*
          path: artifacts/promotable-quality-evidence
          merge-multiple: true
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}

      - name: Verify evidence belongs to checked out source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$(node -p "JSON.parse(require('fs').readFileSync('artifacts/promotable-quality-evidence/manifest.json','utf8')).sourceCommit")"

      - name: Promote complete 14x3 matrix
        run: >
          node scripts/promote-template-golden-baseline.mjs
          artifacts/promotable-quality-evidence
          "${{ inputs.template_key }}"
          "${{ inputs.template_version }}"
          "${{ inputs.baseline_directory }}"

      - name: Upload promotable golden baseline
        uses: actions/upload-artifact@v4
        with:
          name: golden-baseline-${{ inputs.template_key }}-v${{ inputs.template_version }}-${{ github.run_id }}
          path: ${{ inputs.baseline_directory }}/*.png
          if-no-files-found: error
          retention-days: 30
