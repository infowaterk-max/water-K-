name: Shoperation Sentinel

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect observation snapshot
        id: snapshot
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            try{
            const cutoff=Date.now()-30*24*60*60*1000;
            const workflowRuns=[];
            for(let page=1;page<=5;page+=1){
              const response=await github.rest.actions.listWorkflowRunsForRepo({...context.repo,per_page:100,page});
              const batch=response.data.workflow_runs||[];
              for(const run of batch){
                const created=Date.parse(run.created_at);
                if(Number.isFinite(created)&&created>=cutoff)workflowRuns.push({id:String(run.id),name:run.name,conclusion:run.conclusion,status:run.status,event:run.event,headBranch:run.head_branch,createdAt:run.created_at,updatedAt:run.updated_at,headSha:run.head_sha});
              }
              if(batch.length<100||batch.some(run=>Date.parse(run.created_at)<cutoff))break;
            }
            const issueRows=await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',per_page:100});
            const scopeCache=new Map();
            const sourceScopeFor=async body=>{
              const sourceCommit=String(body||'').match(/Source commit:\s*`([0-9a-f]{7,40})`/i)?.[1]||null;
              if(!sourceCommit)return{sourceCommit:null,sourceScope:null};
              if(scopeCache.has(sourceCommit))return{sourceCommit,sourceScope:scopeCache.get(sourceCommit)};
              let sourceScope=null;
              try{
                await github.rest.repos.getCommit({...context.repo,ref:sourceCommit});
                const comparison=await github.rest.repos.compareCommits({...context.repo,base:sourceCommit,head:context.sha});
                sourceScope=comparison.data.merge_base_commit?.sha===sourceCommit?'canonical':'development';
              }catch(error){core.warning(`Could not prove ancestry for Failure Intake source ${sourceCommit}: ${error.message}`);}
              scopeCache.set(sourceCommit,sourceScope);
              return{sourceCommit,sourceScope};
            };
            const openIssues=[];
            for(const issue of issueRows.filter(issue=>!issue.pull_request)){
              const body=issue.body||'';
              const provenance=body.includes('<!-- shoperation-failure-intake:')?await sourceScopeFor(body):{sourceCommit:null,sourceScope:null};
              openIssues.push({number:issue.number,title:issue.title,body,updatedAt:issue.updated_at,pullRequest:false,...provenance});
            }
            const snapshot={contract:'shoporation.sentinel-source-snapshot.v1',repository:`${context.repo.owner}/${context.repo.repo}`,sourceCommit:context.sha,collectedAt:new Date().toISOString(),workflowRuns,openIssues};
            fs.mkdirSync('artifacts/shoperation-sentinel',{recursive:true});
            fs.writeFileSync('artifacts/shoperation-sentinel/source-snapshot.json',JSON.stringify(snapshot,null,2)+'\n');
            }catch(error){
              const message=error instanceof Error?error.message:String(error);
              fs.mkdirSync('artifacts/shoperation-sentinel',{recursive:true});
              fs.writeFileSync('artifacts/shoperation-sentinel/source-failure.json',JSON.stringify({
                contract:'shoporation.sentinel-source-failure.v1',
                decision:'FAIL',
                sourceCommit:context.sha,
                errors:[{code:'SENTINEL_SOURCE_COLLECTION_FAILED',reason:message,expected:'30-day workflow and issue observation snapshot collected',actual:message}]
              },null,2)+'\n');
              core.setFailed('SENTINEL_SOURCE_COLLECTION_FAILED');
            }

      - name: Collect latest main Control Plane evidence
        id: control_plane_evidence
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="artifacts/shoperation-sentinel/control_plane_evidence"
          mkdir -p "$dir"
          trap 'printf "%s\n" "{\"contract\":\"shoporation.command-diagnostic.v1\",\"code\":\"SENTINEL_CONTROL_PLANE_EVIDENCE_COLLECTION_FAILED\",\"decision\":\"BLOCK\"}" > "$dir/collection-failure.json"' ERR
          run_id="$(gh run list --workflow=ci.yml --branch=main --status=completed --limit=1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)"
          if [ -z "$run_id" ]; then
            printf "%s\n" '{"contract":"shoporation.sentinel-control_plane_evidence.v1","state":"UNKNOWN","reason":"NO_COMPLETED_MAIN_CI_RUN"}' > "$dir/collection.json"
            exit 0
          fi
          gh run view "$run_id" --json databaseId,headSha,conclusion,status,event,headBranch > "$dir/run.json"
          gh run download "$run_id" --pattern 'shoperation-development-guard-*' --dir "$dir" || true
          gh run download "$run_id" --pattern 'shoperation-quality-knowledge-*' --dir "$dir" || true
          gh run download "$run_id" --name release-risk-budget --dir "$dir" || true

      - name: Sentinel integrity probe
        id: integrity
        if: steps.snapshot.outcome == 'success'
        continue-on-error: true
        env:
          SHOPERATION_DIAGNOSTIC_CODE: SENTINEL_INTEGRITY_PROBE_EXECUTION_FAILED
          SHOPERATION_DIAGNOSTIC_GATE: sentinel-integrity
          SHOPERATION_DIAGNOSTIC_EXPECTED: Sentinel integrity probe emits structured observation evidence
          SHOPERATION_DIAGNOSTIC_OUTPUT: artifacts/shoperation-sentinel/integrity-diagnostic.json
          SHOPERATION_SOURCE_COMMIT: ${{ github.sha }}
          SHOPERATION_ENVIRONMENT: scheduled-quality
          SHOPERATION_SENTINEL_CONTROL_PLANE_EVIDENCE_DIR: artifacts/shoperation-sentinel/control_plane_evidence
        run: node scripts/shoperation-command-diagnostic.mjs -- node scripts/shoperation-sentinel-integrity-probe.mjs

      - name: Sentinel Deep Scan
        id: sentinel
        if: steps.snapshot.outcome == 'success'
        env:
          SHOPERATION_DIAGNOSTIC_CODE: SENTINEL_SCAN_EXECUTION_FAILED
          SHOPERATION_DIAGNOSTIC_GATE: sentinel
          SHOPERATION_DIAGNOSTIC_EXPECTED: Sentinel Deep Scan completes and emits report
          SHOPERATION_DIAGNOSTIC_OUTPUT: artifacts/shoperation-sentinel/scan-diagnostic.json
          SHOPERATION_SOURCE_COMMIT: ${{ github.sha }}
          SHOPERATION_ENVIRONMENT: scheduled-quality
        run: node scripts/shoperation-command-diagnostic.mjs -- node scripts/shoperation-sentinel-scan.mjs

      - name: Publish Sentinel summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/shoperation-sentinel/sentinel-report.md ]; then cat artifacts/shoperation-sentinel/sentinel-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload Sentinel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoperation-sentinel-${{ github.sha }}
          path: artifacts/shoperation-sentinel/**
          if-no-files-found: error
          retention-days: 90

      - name: Create Sentinel execution failure intake
        if: always() && (steps.snapshot.outcome == 'failure' || steps.control_plane_evidence.outcome == 'failure' || steps.integrity.outcome == 'failure' || steps.sentinel.outcome == 'failure')
        shell: bash
        env:
          SNAPSHOT_OUTCOME: ${{ steps.snapshot.outcome }}
          CONTROL_PLANE_EVIDENCE_OUTCOME: ${{ steps.control_plane_evidence.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
          SCAN_OUTCOME: ${{ steps.sentinel.outcome }}
          SHOPERATION_SOURCE_COMMIT: ${{ github.sha }}
          SHOPERATION_FAILURE_SOURCE: sentinel
          SHOPERATION_ENVIRONMENT: scheduled-quality
          SHOPERATION_CI_RUN_ID: ${{ github.run_id }}
          SHOPERATION_CI_WORKFLOW: ${{ github.workflow }}
        run: |
          codes=""
          specs=""
          if [ "$SNAPSHOT_OUTCOME" = "failure" ]; then
            codes="${codes}SENTINEL_SOURCE_COLLECTION_FAILED;"
            specs="SENTINEL_SOURCE_COLLECTION_FAILED=artifacts/shoperation-sentinel/source-failure.json"
          fi
          if [ "$CONTROL_PLANE_EVIDENCE_OUTCOME" = "failure" ]; then
            codes="${codes}SENTINEL_CONTROL_PLANE_EVIDENCE_COLLECTION_FAILED;"
            if [ -n "$specs" ]; then specs="${specs};"; fi
            specs="${specs}SENTINEL_CONTROL_PLANE_EVIDENCE_COLLECTION_FAILED=artifacts/shoperation-sentinel/control_plane_evidence/collection-failure.json"
          fi
          if [ "$INTEGRITY_OUTCOME" = "failure" ]; then
            codes="${codes}SENTINEL_INTEGRITY_PROBE_EXECUTION_FAILED;"
            if [ -n "$specs" ]; then specs="${specs};"; fi
            specs="${specs}SENTINEL_INTEGRITY_PROBE_EXECUTION_FAILED=artifacts/shoperation-sentinel/integrity-diagnostic.json"
          fi
          if [ "$SCAN_OUTCOME" = "failure" ]; then
            codes="${codes}SENTINEL_SCAN_EXECUTION_FAILED;"
            if [ -n "$specs" ]; then specs="${specs};"; fi
            specs="${specs}SENTINEL_SCAN_EXECUTION_FAILED=artifacts/shoperation-sentinel/scan-diagnostic.json"
          fi
          SHOPERATION_DIAGNOSTIC_ARTIFACTS="$specs" SHOPERATION_GENERIC_FAILURES="$codes" node scripts/shoperation-failure-intake.mjs

      - name: Upload Sentinel execution failure intake
        if: always() && (steps.snapshot.outcome == 'failure' || steps.control_plane_evidence.outcome == 'failure' || steps.integrity.outcome == 'failure' || steps.sentinel.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: shoperation-sentinel-failure-intake-${{ github.sha }}
          path: artifacts/shoperation-failure-intake/**
          if-no-files-found: error
          retention-days: 90

      - name: Sync Sentinel attention issue
        if: steps.sentinel.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const marker='<!-- shoperation-sentinel -->';
            const file='artifacts/shoperation-sentinel/sentinel-report.json';
            const report=JSON.parse(fs.readFileSync(file,'utf8'));
            const recent=await github.rest.issues.listForRepo({...context.repo,state:'all',sort:'updated',direction:'desc',per_page:100});
            const existing=(recent.data||[]).find(issue=>!issue.pull_request&&(issue.body||'').includes(marker));
            if(report.status==='HEALTHY'){
              if(existing&&existing.state==='open'){
                await github.rest.issues.createComment({...context.repo,issue_number:existing.number,body:`Sentinel recovered to HEALTHY on \`${context.sha}\`. Closing automatically.`});
                await github.rest.issues.update({...context.repo,issue_number:existing.number,state:'closed'});
              }
              return;
            }
            const title=report.status==='ACTION_REQUIRED'?'[Sentinel] System improvement action required':'[Sentinel] System pattern requires review';
            const body=`${marker}
            <!-- shoperation-sentinel-state:${report.status} -->

            Source commit: \`${context.sha}\`

            Status: **${report.status}**

            Generated: \`${report.generatedAt}\`

            Main/scheduled 24h failures: **${report.windows.system.last24h.failures}/${report.windows.system.last24h.runs}**

            Main/scheduled 7d failures: **${report.windows.system.last7d.failures}/${report.windows.system.last7d.runs}**

            Main/scheduled 30d failures: **${report.windows.system.last30d.failures}/${report.windows.system.last30d.runs}**

            Open Failure Intake fingerprints: **${report.openEvidence.fingerprints.length}**

            Deep Atlas attention issues: **${report.openEvidence.deepAtlasAttentionIssues}**

            Integrity probe: **${report.integrity?.decision||'UNKNOWN'}** · findings **${report.integrity?.counts?.findings??'unknown'}**

            Signals:
            ${report.signals.length?report.signals.map(s=>`- \`${s.code}\`: ${s.reason}`).join('\n'):'- none'}

            Recommendations:
            ${report.recommendations.length?report.recommendations.map(x=>`- ${x}`).join('\n'):'- none'}

            Sentinel is observation-only. It cannot modify code or override an existing authority.`;
            if(existing)await github.rest.issues.update({...context.repo,issue_number:existing.number,title,body,state:'open'});
            else await github.rest.issues.create({...context.repo,title,body});
