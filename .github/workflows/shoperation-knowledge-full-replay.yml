name: Shoperation Knowledge Full Replay
on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  full-knowledge-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHOPERATION_KNOWLEDGE_FORCE_FULL: '1'
      QUALITY_HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Knowledge Before Build — full replay
        id: knowledge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/shoperation-knowledge-preflight.mjs
      - name: Full regression suite
        id: tests
        run: npm test
      - name: TypeScript check
        id: typecheck
        env:
          SHOPERATION_DIAGNOSTIC_CODE: TYPECHECK_FAILED
          SHOPERATION_DIAGNOSTIC_GATE: periodic-full-replay-typecheck
          SHOPERATION_DIAGNOSTIC_EXPECTED: TypeScript check PASS
          SHOPERATION_DIAGNOSTIC_OUTPUT: artifacts/shoperation-command-diagnostics/full-replay-typecheck.json
          SHOPERATION_SOURCE_COMMIT: ${{ github.sha }}
          SHOPERATION_ENVIRONMENT: periodic-full-replay
        run: node scripts/shoperation-command-diagnostic.mjs -- npm run typecheck
      - name: Upload knowledge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoperation-knowledge-full-replay-${{ github.sha }}
          path: artifacts/shoperation-quality/**
          if-no-files-found: warn
          retention-days: 90
      - name: Create full-replay failure intake
        if: always()
        shell: bash
        env:
          KNOWLEDGE_OUTCOME: ${{ steps.knowledge.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          SHOPERATION_SOURCE_COMMIT: ${{ github.sha }}
          SHOPERATION_FAILURE_SOURCE: periodic-full-replay
          SHOPERATION_ENVIRONMENT: periodic-full-replay
          SHOPERATION_CI_RUN_ID: ${{ github.run_id }}
          SHOPERATION_CI_WORKFLOW: ${{ github.workflow }}
          SHOPERATION_DIAGNOSTIC_ARTIFACTS: >-
            KNOWLEDGE_PREFLIGHT_FAILED=artifacts/shoperation-quality/knowledge-preflight.json;
            TEST_FAILED=artifacts/test-results.json;
            TYPECHECK_FAILED=artifacts/shoperation-command-diagnostics/full-replay-typecheck.json
        run: |
          codes=""
          [ "$KNOWLEDGE_OUTCOME" != "failure" ] || codes="${codes}KNOWLEDGE_PREFLIGHT_FAILED;"
          [ "$TEST_OUTCOME" != "failure" ] || codes="${codes}TEST_FAILED;"
          [ "$TYPECHECK_OUTCOME" != "failure" ] || codes="${codes}TYPECHECK_FAILED;"
          SHOPERATION_GENERIC_FAILURES="$codes" node scripts/shoperation-failure-intake.mjs
      - name: Upload full-replay failure intake
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoperation-failure-intake-${{ github.sha }}
          path: |
            artifacts/shoperation-failure-intake/**
            artifacts/shoperation-command-diagnostics/**
          if-no-files-found: warn
          retention-days: 90
      - name: Persist unresolved failure intake
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const file='artifacts/shoperation-failure-intake/failure-intake.json';
            if(!fs.existsSync(file))return;
            const report=JSON.parse(fs.readFileSync(file,'utf8'));
            const unresolved=(report.records||[]).filter(r=>['candidate-new-failure','needs-review'].includes(r.classificationStatus));
            if(!unresolved.length)return;
            const open=await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',per_page:100});
            for(const record of unresolved){
              const identity=record.failureFingerprint||record.candidateId;
              const marker=`<!-- shoperation-failure-intake:${identity} -->`;
              if(open.some(issue=>(issue.body||'').includes(marker)))continue;
              await github.rest.issues.create({...context.repo,title:`[Quality intake] ${identity}: ${record.rawErrorCode}`,body:`${marker}\n\nContract: \`shoporation.failure-intake.v2\`\n\nFingerprint: \`${record.failureFingerprint||'unknown'}\`\n\nSource commit: \`${record.sourceCommit||'unknown'}\`\n\nCI run: \`${record.ciRunId||'unknown'}\`\n\nSource: \`${record.failureSource}\`\n\nGate: \`${record.gate||record.gateCode||'unknown'}\`\n\nClassification: \`${record.classificationStatus}\`\n\nReason: ${record.reason||record.symptom}\n\nLocation: ${record.file||record.route||record.endpoint||'not localized'}\n\nThis issue remains open until the failure is matched, promoted, scoped, deduplicated or rejected with an explicit disposition.`});
            }

      - name: Collect Failure Intake reconciliation evidence
        if: always()
        env:
          FULL_REGRESSION_OUTCOME: ${{ steps.tests.outcome }}
          FULL_TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const atlasFile='artifacts/shoperation-atlas/codebase-atlas.json';
            const atlas=fs.existsSync(atlasFile)?JSON.parse(fs.readFileSync(atlasFile,'utf8')):null;
            const atlasDomainResolvedFiles=(atlas?.nodes||[]).filter(node=>Array.isArray(node.domains)&&node.domains.length>0).map(node=>node.path);
            const open=await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',per_page:100});
            const intake=open.filter(issue=>!issue.pull_request&&(issue.body||'').includes('<!-- shoperation-failure-intake:'));
            const issues=[];
            const scopeCache=new Map();
            const sourceScopeFor=async body=>{
              const sourceCommit=String(body||'').match(/Source commit:\s*`([0-9a-f]{7,40})`/i)?.[1]||null;
              if(!sourceCommit)return{sourceCommit:null,sourceScope:null};
              if(scopeCache.has(sourceCommit))return{sourceCommit,sourceScope:scopeCache.get(sourceCommit)};
              let sourceScope=null;
              try{
                await github.rest.repos.getCommit({...context.repo,ref:sourceCommit});
                const comparison=await github.rest.repos.compareCommits({...context.repo,base:sourceCommit,head:context.sha});
                sourceScope=comparison.data.merge_base_commit?.sha===sourceCommit?'canonical':'development';
              }catch(error){core.warning(`Could not prove ancestry for Failure Intake source ${sourceCommit}: ${error.message}`);}
              scopeCache.set(sourceCommit,sourceScope);
              return{sourceCommit,sourceScope};
            };
            for(const issue of intake){
              const body=issue.body||'';
              const provenance=await sourceScopeFor(body);
              const runId=body.match(/CI run:\s*`(\d+)`/)?.[1]||null;
              let sourceRun=null,laterSuccess=null;
              if(runId){
                try{
                  const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(runId)})).data;
                  sourceRun={id:String(run.id),name:run.name,workflowId:run.workflow_id,event:run.event,headBranch:run.head_branch,headSha:run.head_sha,conclusion:run.conclusion,createdAt:run.created_at};
                  const successes=await github.paginate(github.rest.actions.listWorkflowRuns,{...context.repo,workflow_id:run.workflow_id,branch:run.head_branch||undefined,status:'success',per_page:100});
                  const later=successes.filter(candidate=>Date.parse(candidate.created_at)>Date.parse(run.created_at)).sort((a,b)=>Date.parse(a.created_at)-Date.parse(b.created_at))[0];
                  if(later)laterSuccess={id:String(later.id),event:later.event,headBranch:later.head_branch,headSha:later.head_sha,createdAt:later.created_at};
                }catch(error){core.warning(`Could not resolve source workflow for intake #${issue.number}: ${error.message}`);}
              }
              const location=body.match(/Location:\s*([^\n]+)/)?.[1]?.trim()||null;
              const normalizedLocation=location?.includes('/water-K-/')?location.split('/water-K-/').at(-1):location;
              issues.push({number:issue.number,title:issue.title,body,updatedAt:issue.updated_at,location:normalizedLocation,sourceRun,laterSuccess,...provenance});
            }
            fs.mkdirSync('artifacts/shoperation-failure-intake-reconciliation',{recursive:true});
            fs.writeFileSync('artifacts/shoperation-failure-intake-reconciliation/source-snapshot.json',JSON.stringify({contract:'shoporation.failure-intake-reconciliation-source.v1',repository:`${context.repo.owner}/${context.repo.repo}`,sourceCommit:context.sha,collectedAt:new Date().toISOString(),proofs:{fullRegressionPassed:process.env.FULL_REGRESSION_OUTCOME==='success',typecheckPassed:process.env.FULL_TYPECHECK_OUTCOME==='success',atlasDomainResolvedFiles},issues},null,2)+'\n');

      - name: Run deterministic Failure Intake reconciliation
        if: always()
        run: node scripts/shoperation-failure-intake-reconcile.mjs

      - name: Apply explicit Failure Intake dispositions
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const file='artifacts/shoperation-failure-intake-reconciliation/reconciliation.json';
            if(!fs.existsSync(file))return;
            const report=JSON.parse(fs.readFileSync(file,'utf8'));
            for(const action of report.closeActions||[]){
              const current=(await github.rest.issues.get({...context.repo,issue_number:action.issueNumber})).data;
              if(current.state!=='open')continue;
              const dispositionMarker=`<!-- shoperation-failure-intake-disposition:${action.disposition} -->`;
              const currentBody=current.body||'';
              const nextBody=currentBody.includes(dispositionMarker)?currentBody:currentBody+`\n\n${dispositionMarker}\nDisposition: **${action.disposition}**. ${action.reason}\nReconciled by Shoperation Knowledge Full Replay on \`${context.sha}\`.`;
              await github.rest.issues.update({...context.repo,issue_number:action.issueNumber,state:'closed',body:nextBody});
            }

      - name: Upload Failure Intake reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoperation-failure-intake-reconciliation-${{ github.sha }}
          path: artifacts/shoperation-failure-intake-reconciliation/**
          if-no-files-found: error
          retention-days: 90
