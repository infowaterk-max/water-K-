name: F6-U03g real historical 0046 PostgreSQL17 fixture
on:
  push:
    branches:
      - feature/core-1186-f6-u03g-positive-0046-fixture
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-0046:
    name: Reconstruct 0046 from 47 original SQL files in ephemeral PostgreSQL17
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f6-u03g-local-only
          POSTGRES_DB: f6_u03g_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d f6_u03g_fixture"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Checkout full source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Build reviewed 0046 bundle and verify historical blob identities
        shell: bash
        run: |
          node scripts/shoperation-f6-u03g-positive-fixture.mjs --emit-bundle artifacts/f6-u03g/schema
          node --input-type=module <<'NODE'
          import{readFileSync}from'node:fs';
          import{execFileSync}from'node:child_process';
          const m=JSON.parse(readFileSync('artifacts/f6-u03g/schema/manifest.json'));
          if(m.sourceCount!==47||m.hostedDatabaseTouched!==false)throw Error('F6U03G_MISSING_SOURCE');
          for(const f of m.files){
            const a=execFileSync('git',['rev-parse','HEAD:'+f.path],{encoding:'utf8'}).trim();
            const b=execFileSync('git',['rev-parse','03a7f0f690f94fa955e1ad459e3d5eb1fe22cbf4:'+f.path],{encoding:'utf8'}).trim();
            if(a!==b)throw Error('F6U03G_HISTORICAL_BLOB_DRIFT:'+f.path);
          }
          console.log('47 historical SQL blobs unchanged');
          NODE
      - name: Prove the exact ephemeral PostgreSQL17 Docker target
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PGPASSWORD: f6-u03g-local-only
        run: |
          expected="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$POSTGRES_CONTAINER")"
          test -n "$expected"
          actual="$(psql -XAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d f6_u03g_fixture -c "select host(inet_server_addr())||'|'||current_database()||'|'||current_user||'|'||current_setting('server_version_num')")"
          case "$actual" in "$expected|f6_u03g_fixture|postgres|17"????) echo 'Docker target verified';; *) echo "BAD TARGET $actual" >&2; exit 1;; esac
      - name: Create explicitly limited Supabase Auth Storage stand-ins
        shell: bash
        env:
          PGPASSWORD: f6-u03g-local-only
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d f6_u03g_fixture -f artifacts/f6-u03g/schema/fixture-bootstrap.sql
      - name: Replay exact historical SQL atomically and STOP on error
        shell: bash
        env:
          PGPASSWORD: f6-u03g-local-only
        run: |
          set +e
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d f6_u03g_fixture -f artifacts/f6-u03g/schema/replay-0046.sql >artifacts/f6-u03g/schema/replay.log 2>artifacts/f6-u03g/schema/replay.err
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo 'F6U03G_ACTUAL_0046_REPLAY_BLOCKED' >&2
            tail -n 40 artifacts/f6-u03g/schema/replay.err >&2
            exit "$rc"
          fi
      - name: Report counts, raw fingerprint and exact unchanged guard result
        shell: bash
        env:
          PGPASSWORD: f6-u03g-local-only
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync}from'node:fs';
          import{TRANSACTION_GUARD_SQL}from'./scripts/shoperation-f6-u03f-target-transaction-guard.mjs';
          const m=TRANSACTION_GUARD_SQL.match(/EXECUTE \$f6_catalog\$([\s\S]*?)\$f6_catalog\$ INTO/);
          if(!m)throw Error('F6U03G_UNCHANGED_CATALOG_GUARD_ABSENT');
          writeFileSync('artifacts/f6-u03g/schema/catalog.sql',m[1].trim()+';\n');
          writeFileSync('artifacts/f6-u03g/schema/guard.sql','BEGIN;\n'+TRANSACTION_GUARD_SQL+'\nROLLBACK;\n');
          NODE
          psql -XAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d f6_u03g_fixture -f artifacts/f6-u03g/schema/catalog.sql > artifacts/f6-u03g/schema/catalog.txt
          psql -XAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d f6_u03g_fixture -c "SELECT (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN('r','p') AND NOT c.relispartition)||'|'||(SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='private' AND c.relkind IN('r','p') AND NOT c.relispartition)||'|'||(SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public')||'|'||(SELECT count(*) FROM pg_policy p JOIN pg_class c ON c.oid=p.polrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public')" > artifacts/f6-u03g/schema/counts.txt
          set +e
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d f6_u03g_fixture -f artifacts/f6-u03g/schema/guard.sql >artifacts/f6-u03g/schema/guard.log 2>artifacts/f6-u03g/schema/guard.err
          rc=$?
          set -e
          node --input-type=module - "$rc" <<'NODE'
          import{readFileSync,writeFileSync}from'node:fs';
          import{classifyFixtureResult}from'./scripts/shoperation-f6-u03g-positive-fixture.mjs';
          const nums=readFileSync('artifacts/f6-u03g/schema/counts.txt','utf8').trim().split('|').map(Number);
          const fp=readFileSync('artifacts/f6-u03g/schema/catalog.txt','utf8').trim().split('|');
          const v=classifyFixtureResult({actual47Committed:true,realPostgres17:true,sourceCount:47,
           publicTables:nums[0],privateTables:nums[1],publicFunctions:nums[2],publicPolicies:nums[3],
           definitionCount:Number(fp[0]),definitionMd5:fp[1],fullGuardVerdict:Number(process.argv[2])===0?'PASS':'BLOCKED'});
          if(v.structuralParity!=='PASS')throw Error('F6U03G_HISTORICAL_APP_OBJECT_COUNT_MISMATCH');
          const proof={...v,observedCounts:nums,observedCatalog:fp,
            guardError:Number(process.argv[2])===0?null:readFileSync('artifacts/f6-u03g/schema/guard.err','utf8').slice(0,1500)};
          writeFileSync('artifacts/f6-u03g/schema/result.json',JSON.stringify(proof,null,2));
          console.log(JSON.stringify(proof,null,2));
          NODE
      - name: Preserve raw failure and parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f6-u03g-real-0046-${{ github.sha }}
          path: artifacts/f6-u03g/schema/
          if-no-files-found: warn
          retention-days: 14
