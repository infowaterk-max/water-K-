name: Temporary Digital Commerce acceptance proof

on:
  push:
    branches:
      - feature/digital-commerce-product-documents
    paths:
      - src/app/api/internal/digital-commerce-acceptance/route.ts
      - .github/workflows/digital-commerce-acceptance-proof.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://water-k-native-git-feature-digital-comme-53d941-infowaterk-5067.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Verify Vercel automation bypass secret
        shell: bash
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET repository secret is missing." >&2
            exit 1
          fi

      - name: Run exact-head Digital Commerce acceptance
        shell: bash
        run: |
          set -euo pipefail
          rm -f response.json

          for attempt in $(seq 1 40); do
            status="$(
              curl --silent --show-error                 --output response.json                 --write-out '%{http_code}'                 --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"                 --header "x-shoperation-acceptance-proof: $GITHUB_SHA"                 "$BASE_URL/api/internal/digital-commerce-acceptance"
            )"

            if [ "$status" = "200" ]; then
              break
            fi

            if [ "$status" = "500" ] || [ "$status" = "409" ]; then
              echo "Acceptance endpoint returned HTTP $status." >&2
              cat response.json >&2 || true
              exit 1
            fi

            if [ "$attempt" -eq 40 ]; then
              echo "Acceptance endpoint did not become ready for exact SHA $GITHUB_SHA; last HTTP $status." >&2
              cat response.json >&2 || true
              exit 1
            fi

            sleep 10
          done

          node <<'NODE'
          const fs=require('node:fs');
          const value=JSON.parse(fs.readFileSync('response.json','utf8'));
          const e=value?.evidence;
          const required=[
            value?.ok===true,
            e?.commit===process.env.GITHUB_SHA,
            e?.environment==='preview-staging',
            e?.upload?.signedUpload===true,
            e?.upload?.activated===true,
            e?.purchase?.status==='paid',
            e?.purchase?.paidAtEvidence===true,
            e?.purchase?.entitlementActive===true,
            e?.guest?.tokenPersistedAsHashOnly===true,
            e?.download?.httpStatus===200,
            e?.download?.checksumMatch===true,
            e?.download?.downloadCount===1,
            e?.download?.auditAllowed===1,
            e?.refund?.status==='refunded',
            e?.refund?.entitlementRevoked===true,
            e?.refund?.guestTokenRevoked===true,
            e?.refund?.postRefundDenied===true,
            e?.nonceConsumed===true,
          ];
          if(required.some(result=>result!==true)){
            console.error(JSON.stringify(value,null,2));
            throw new Error('DIGITAL_COMMERCE_ACCEPTANCE_EVIDENCE_INVALID');
          }
          console.log(JSON.stringify(value,null,2));
          NODE

      - name: Record acceptance evidence
        if: success()
        shell: bash
        run: |
          {
            echo '## Digital Commerce exact-head acceptance'
            echo ''
            echo "- Source commit: $GITHUB_SHA"
            echo '- Environment: protected Vercel preview -> staging Supabase'
            echo '- Signed upload -> activation -> paid entitlement -> guest access -> signed download: PASS'
            echo '- Download checksum and counter: PASS'
            echo '- Refund -> entitlement/token revocation -> post-refund DENY: PASS'
            echo '- Production: untouched'
          } >> "$GITHUB_STEP_SUMMARY"
