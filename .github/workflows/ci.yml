name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'roadmap/**'
      - core-engine-2-batch
      - production-provisioning-acceptance
      - release-nonpayment-final-batch
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Production dependency security audit
        shell: bash
        run: |
          set -u
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            audit_log="$(mktemp)"
            set +e
            npm_config_fetch_timeout=60000 npm_config_fetch_retries=1 npm_config_fetch_retry_maxtimeout=10000 \
              npm audit --omit=dev --audit-level=high 2>&1 | tee "$audit_log"
            audit_rc=${PIPESTATUS[0]}
            set -e

            if [ "$audit_rc" -eq 0 ]; then
              rm -f "$audit_log"
              exit 0
            fi

            if ! grep -Eqi 'network timeout|ETIMEDOUT|ECONNRESET|EAI_AGAIN|ECONNREFUSED|ENETUNREACH|EHOSTUNREACH|502 Bad Gateway|503 Service Unavailable|504 Gateway' "$audit_log"; then
              echo 'npm audit failed with a non-network error or vulnerability finding; failing without retry.'
              rm -f "$audit_log"
              exit "$audit_rc"
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "npm audit network failure persisted for $max_attempts attempts."
              rm -f "$audit_log"
              exit "$audit_rc"
            fi

            echo "Transient npm audit network failure on attempt $attempt/$max_attempts; retrying."
            rm -f "$audit_log"
            sleep $((attempt * 5))
          done

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Knowledge Before Build preflight
        id: knowledge
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/shoperation-knowledge-preflight.mjs

      - name: Plan Before Code Gate
        if: github.event_name == 'pull_request'
        id: development-plan
        env:
          DEVELOPMENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEVELOPMENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/shoperation-plan-before-code.mjs --check

      - name: Edit-Time Known Failure Guard
        if: github.event_name == 'pull_request'
        id: edit-time-guard
        run: node scripts/shoperation-edit-time-guard.mjs --check

      - name: Incremental Known Failure Replay
        id: incremental-replay
        run: node scripts/shoperation-incremental-replay.mjs --check

      - name: Upload Development Guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoperation-development-guard-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/shoperation-development-guard/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Shoperation knowledge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoperation-quality-knowledge-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/shoperation-quality/**
          if-no-files-found: warn
          retention-days: 30

      - name: Production release risk budget
        id: release-risk
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RELEASE_BASE_REF: origin/main
        run: node scripts/release-risk-budget.mjs

      - name: Upload release risk budget
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-risk-budget
          path: artifacts/release-risk-budget.json
          if-no-files-found: warn
          retention-days: 30

      - name: Customer database baseline guard
        run: npm run db:customer:guard

      - name: Block 24 market-ready contract
        run: npm run market-ready:gate

      - name: Upload Block 24 market-ready contract
        uses: actions/upload-artifact@v4
        with:
          name: block24-market-ready-contract
          path: artifacts/block24-market-ready-contract.json
          if-no-files-found: error
          retention-days: 30

      - name: Prepare quality artifacts
        run: mkdir -p artifacts

      - name: Quality tests
        id: quality-tests
        run: npm test

      - name: Upload quality test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-test-results
          path: artifacts/test-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: TypeScript check
        id: typecheck
        run: npm run typecheck

      - name: Production build
        id: production-build
        run: npm run build

      - name: Generate release manifest
        env:
          DEPLOY_ENVIRONMENT: ci
        run: npm run release:manifest

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Create Shoperation failure intake
        if: always()
        shell: bash
        env:
          KNOWLEDGE_OUTCOME: ${{ steps.knowledge.outcome }}
          DEVELOPMENT_PLAN_OUTCOME: ${{ steps.development-plan.outcome }}
          EDIT_GUARD_OUTCOME: ${{ steps.edit-time-guard.outcome }}
          INCREMENTAL_OUTCOME: ${{ steps.incremental-replay.outcome }}
          RISK_OUTCOME: ${{ steps.release-risk.outcome }}
          QUALITY_OUTCOME: ${{ steps.quality-tests.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.production-build.outcome }}
          SHOPERATION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SHOPERATION_FAILURE_SOURCE: ci
        run: |
          codes=""
          [ "$KNOWLEDGE_OUTCOME" != "failure" ] || codes="${codes}KNOWLEDGE_PREFLIGHT_FAILED;"
          [ "$DEVELOPMENT_PLAN_OUTCOME" != "failure" ] || codes="${codes}DEVELOPMENT_PLAN_FAILED;"
          [ "$EDIT_GUARD_OUTCOME" != "failure" ] || codes="${codes}EDIT_TIME_GUARD_FAILED;"
          [ "$INCREMENTAL_OUTCOME" != "failure" ] || codes="${codes}INCREMENTAL_REPLAY_FAILED;"
          [ "$RISK_OUTCOME" != "failure" ] || codes="${codes}RELEASE_RISK_BUDGET_FAILED;"
          [ "$QUALITY_OUTCOME" != "failure" ] || codes="${codes}TEST_FAILED;"
          [ "$TYPECHECK_OUTCOME" != "failure" ] || codes="${codes}TYPECHECK_FAILED;"
          [ "$BUILD_OUTCOME" != "failure" ] || codes="${codes}BUILD_FAILED;"
          SHOPERATION_GENERIC_FAILURES="$codes" node scripts/shoperation-failure-intake.mjs

      - name: Upload Shoperation failure intake
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoperation-failure-intake-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/shoperation-failure-intake/**
          if-no-files-found: warn
          retention-days: 90

      - name: Persist unresolved failure intake
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const file='artifacts/shoperation-failure-intake/failure-intake.json';
            if(!fs.existsSync(file))return;
            const report=JSON.parse(fs.readFileSync(file,'utf8'));
            const unresolved=(report.records||[]).filter(r=>['candidate-new-failure','needs-review'].includes(r.classificationStatus));
            if(!unresolved.length)return;
            const open=await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',per_page:100});
            for(const record of unresolved){
              const marker=`<!-- shoperation-failure-intake:${record.candidateId} -->`;
              if(open.some(issue=>(issue.body||'').includes(marker)))continue;
              await github.rest.issues.create({...context.repo,title:`[Quality intake] ${record.candidateId}: ${record.rawErrorCode}`,body:`${marker}\n\nContract: \`shoporation.failure-intake.v1\`\n\nSource commit: \`${record.sourceCommit||'unknown'}\`\n\nSource: \`${record.failureSource}\`\n\nClassification: \`${record.classificationStatus}\`\n\nSymptom: ${record.symptom}\n\nThis issue remains open until the failure is matched, promoted, scoped, deduplicated or rejected with an explicit disposition.`});
            }

  fresh-install-proof:
    if: (github.ref == 'refs/heads/core-engine-2-batch' || github.ref == 'refs/heads/production-provisioning-acceptance' || github.ref == 'refs/heads/feature/roadmap-block24-commercial-security-maturity' || startsWith(github.ref, 'refs/heads/roadmap/') || startsWith(github.ref, 'refs/heads/feature/')) && github.event_name == 'push' && contains(github.event.head_commit.message, '[fresh-install-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHOPERATION_FRESH_INSTALL_DB_URL: ${{ secrets.SHOPERATION_FRESH_INSTALL_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Fresh Install secret
        shell: bash
        run: |
          if [ -z "$SHOPERATION_FRESH_INSTALL_DB_URL" ]; then
            echo "SHOPERATION_FRESH_INSTALL_DB_URL repository secret is missing."
            exit 1
          fi

      - name: Verify reviewed baseline lifecycle
        shell: bash
        run: |
          node -e "const m=require('./supabase/customer-baseline/manifest.json'); if(m.status!=='snapshot-reviewed'||m.freshInstallProofRequired!==true){throw new Error('baseline must be snapshot-reviewed and still require Fresh Install proof')}"
          test -s supabase/customer-baseline/migrations/0001_shoperation_v1_schema.sql
          test -s supabase/customer-baseline/migrations/0002_block7_b2b_account_ownership.sql

      - name: Fresh target preflight
        shell: bash
        run: psql "$SHOPERATION_FRESH_INSTALL_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/customer-baseline/target-preflight.sql

      - name: Apply reviewed baseline atomically
        shell: bash
        run: |
          {
            echo 'BEGIN;'
            while IFS= read -r migration; do cat "$migration"; done < <(find supabase/customer-baseline/migrations -maxdepth 1 -type f -name '*.sql' | sort)
            cat supabase/customer-baseline/auth-bootstrap.sql
            cat supabase/customer-baseline/seed.sql
            echo 'COMMIT;'
          } | psql "$SHOPERATION_FRESH_INSTALL_DB_URL" -X -v ON_ERROR_STOP=1

      - name: Fresh target postflight
        shell: bash
        run: psql "$SHOPERATION_FRESH_INSTALL_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/customer-baseline/target-postflight.sql

      - name: Compute proof contract hash
        shell: bash
        run: |
          echo "Proof contract SHA256:"
          node scripts/customer-baseline-contract-hash.mjs

      - name: Record proof summary
        shell: bash
        run: |
          {
            echo '## Shoperation Fresh Install proof'
            echo ''
            echo '- Target preflight: passed'
            echo '- Reviewed snapshot + forward migrations: applied atomically'
            echo '- Supabase Auth bootstrap: applied'
            echo '- Neutral seed: applied'
            echo '- Target postflight: passed'
            echo '- Production: untouched by this job'
            echo "- Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
