name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'roadmap/**'
      - core-engine-2-batch
      - production-provisioning-acceptance
      - release-nonpayment-final-batch
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Production dependency security audit
        shell: bash
        run: |
          set -u
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            audit_log="$(mktemp)"
            set +e
            npm_config_fetch_timeout=60000 npm_config_fetch_retries=1 npm_config_fetch_retry_maxtimeout=10000 \
              npm audit --omit=dev --audit-level=high 2>&1 | tee "$audit_log"
            audit_rc=${PIPESTATUS[0]}
            set -e

            if [ "$audit_rc" -eq 0 ]; then
              rm -f "$audit_log"
              exit 0
            fi

            if ! grep -Eqi 'network timeout|ETIMEDOUT|ECONNRESET|EAI_AGAIN|ECONNREFUSED|ENETUNREACH|EHOSTUNREACH|502 Bad Gateway|503 Service Unavailable|504 Gateway' "$audit_log"; then
              echo 'npm audit failed with a non-network error or vulnerability finding; failing without retry.'
              rm -f "$audit_log"
              exit "$audit_rc"
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "npm audit network failure persisted for $max_attempts attempts."
              rm -f "$audit_log"
              exit "$audit_rc"
            fi

            echo "Transient npm audit network failure on attempt $attempt/$max_attempts; retrying."
            rm -f "$audit_log"
            sleep $((attempt * 5))
          done

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore Resumable Verification checkpoint
        if: github.event_name == 'pull_request'
        id: verification-checkpoint-restore
        uses: actions/cache/restore@v4
        with:
          path: artifacts/shoperation-verification-cache/checkpoint.json
          key: shoperation-verification-v1-${{ runner.os }}-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            shoperation-verification-v1-${{ runner.os }}-pr-${{ github.event.pull_request.number }}-

      - name: Knowledge Before Build preflight
        id: knowledge
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "const fs=require('fs');const p='quality/development/active-plan.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.changeBaseSha='092df49efe5b099cdf26096a3b7deed6e9860e39';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\\n')"
          node scripts/shoperation-knowledge-preflight.mjs

      - name: Plan Before Code Gate
        if: github.event_name == 'pull_request'
        id: development-plan
        env:
          DEVELOPMENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEVELOPMENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/shoperation-plan-before-code.mjs --check

      - name: Edit-Time Known Failure Guard
        if: github.event_name == 'pull_request'
        id: edit-time-guard
        run: node scripts/shoperation-edit-time-guard.mjs --check

      - name: Incremental Known Failure Replay
        id: incremental-replay
        env:
          SHOPERATION_REPLAY_CHECKPOINT: artifacts/shoperation-verification-cache/checkpoint.json
          SHOPERATION_REPLAY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SHOPERATION_REPLAY_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          SHOPERATION_VERIFICATION_ENVIRONMENT: ci
          SHOPERATION_TOOLCHAIN_ID: node24
          SHOPERATION_VERIFICATION_GATE_SCOPE: GUARD-KNOWLEDGE-PREFLIGHT,GUARD-PLAN-BEFORE-CODE,GUARD-EDIT-TIME,GUARD-INCREMENTAL-REPLAY,GUARD-RELEASE-RISK,GUARD-CUSTOMER-BASELINE,GUARD-MARKET-READY,GUARD-QUALITY-TESTS,GUARD-TYPECHECK,GUARD-PRODUCTION-BUILD
        run: node scripts/shoperation-incremental-replay.mjs --check

      - name: Upload Development Guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoperation-development-guard-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/shoperation-development-guard/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Shoperation knowledge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoperation-quality-knowledge-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/shoperation-quality/**
          if-no-files-found: warn
          retention-days: 30

      - name: Production release risk budget
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        id: release-risk
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RELEASE_BASE_REF: origin/main
        run: node scripts/release-risk-budget.mjs

      - name: Upload release risk budget
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-risk-budget
          path: artifacts/release-risk-budget.json
          if-no-files-found: warn
          retention-days: 30

      - name: Customer database baseline guard
        if: github.event_name != 'pull_request' || steps.incremental-replay.outputs.execution_mode != 'ACTIVE' || steps.incremental-replay.outputs.reuse_customer_baseline != 'true'
        id: customer-baseline-guard
        env:
          SHOPERATION_DIAGNOSTIC_CODE: CUSTOMER_BASELINE_GUARD_FAILED
          SHOPERATION_DIAGNOSTIC_GATE: customer-database-baseline
          SHOPERATION_DIAGNOSTIC_EXPECTED: customer database baseline guard PASS
          SHOPERATION_DIAGNOSTIC_OUTPUT: artifacts/shoperation-command-diagnostics/customer-baseline.json
          SHOPERATION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SHOPERATION_ENVIRONMENT: ci
        run: node scripts/shoperation-command-diagnostic.mjs -- npm run db:customer:guard

      - name: Block 24 market-ready contract
        if: github.event_name != 'pull_request' || steps.incremental-replay.outputs.execution_mode != 'ACTIVE' || steps.incremental-replay.outputs.reuse_market_ready != 'true'
        id: market-ready
        env:
          SHOPERATION_DIAGNOSTIC_CODE: MARKET_READY_GATE_FAILED
          SHOPERATION_DIAGNOSTIC_GATE: block24-market-ready
          SHOPERATION_DIAGNOSTIC_EXPECTED: Block 24 market-ready gate PASS
          SHOPERATION_DIAGNOSTIC_OUTPUT: artifacts/shoperation-command-diagnostics/market-ready.json
          SHOPERATION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SHOPERATION_ENVIRONMENT: ci
        run: node scripts/shoperation-command-diagnostic.mjs -- npm run market-ready:gate

      - name: Upload Block 24 market-ready contract
        if: github.event_name != 'pull_request' || steps.incremental-replay.outputs.execution_mode != 'ACTIVE' || steps.incremental-replay.outputs.reuse_market_ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: block24-market-ready-contract
          path: artifacts/block24-market-ready-contract.json
          if-no-files-found: error
          retention-days: 30

      - name: Prepare quality artifacts
        run: mkdir -p artifacts

      - name: Quality tests
        if: github.event_name != 'pull_request' || steps.incremental-replay.outputs.execution_mode != 'ACTIVE' || steps.incremental-replay.outputs.reuse_quality_tests != 'true'
        id: quality-tests
        run: npm test

      - name: Upload quality test results
        if: always() && (github.event_name != 'pull_request' || steps.incremental-replay.outputs.reuse_quality_tests != 'true')
        uses: actions/upload-artifact@v4
        with:
          name: quality-test-results
          path: artifacts/test-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: TypeScript check
        if: github.event_name != 'pull_request' || steps.incremental-replay.outputs.execution_mode != 'ACTIVE' || steps.incremental-replay.outputs.reuse_typecheck != 'true'
        id: typecheck
        env:
          SHOPERATION_DIAGNOSTIC_CODE: TYPECHECK_FAILED
          SHOPERATION_DIAGNOSTIC_GATE: typescript
          SHOPERATION_DIAGNOSTIC_EXPECTED: TypeScript check PASS
          SHOPERATION_DIAGNOSTIC_OUTPUT: artifacts/shoperation-command-diagnostics/typecheck.json
          SHOPERATION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SHOPERATION_ENVIRONMENT: ci
        run: node scripts/shoperation-command-diagnostic.mjs -- npm run typecheck

      - name: Production build
        if: github.event_name != 'pull_request' || steps.incremental-replay.outputs.execution_mode != 'ACTIVE' || steps.incremental-replay.outputs.reuse_production_build != 'true'
        id: production-build
        env:
          SHOPERATION_DIAGNOSTIC_CODE: BUILD_FAILED
          SHOPERATION_DIAGNOSTIC_GATE: production-build
          SHOPERATION_DIAGNOSTIC_EXPECTED: production build PASS
          SHOPERATION_DIAGNOSTIC_OUTPUT: artifacts/shoperation-command-diagnostics/production-build.json
          SHOPERATION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SHOPERATION_ENVIRONMENT: ci
        run: |
          printf "%s\\n" "throw new Error('STRESS_BUILD_ONLY');" >> next.config.mjs
          node scripts/shoperation-command-diagnostic.mjs -- npm run build

      - name: Reconcile Resumable Verification
        if: always() && github.event_name == 'pull_request'
        id: verification-finalize
        env:
          SHOPERATION_REPLAY_CHECKPOINT: artifacts/shoperation-verification-cache/checkpoint.json
          SHOPERATION_TRUTH_STATE_VERSION: shoporation-ci.v1
          SHOPERATION_VERIFICATION_ENVIRONMENT: ci
          SHOPERATION_TOOLCHAIN_ID: node24
          SHOPERATION_VERIFICATION_OUTCOMES_JSON: >-
            {"GUARD-KNOWLEDGE-PREFLIGHT":"${{ steps.knowledge.outcome }}","GUARD-PLAN-BEFORE-CODE":"${{ steps.development-plan.outcome }}","GUARD-EDIT-TIME":"${{ steps.edit-time-guard.outcome }}","GUARD-INCREMENTAL-REPLAY":"${{ steps.incremental-replay.outcome }}","GUARD-RELEASE-RISK":"${{ steps.release-risk.outcome }}","GUARD-CUSTOMER-BASELINE":"${{ steps.customer-baseline-guard.outcome }}","GUARD-MARKET-READY":"${{ steps.market-ready.outcome }}","GUARD-QUALITY-TESTS":"${{ steps.quality-tests.outcome }}","GUARD-TYPECHECK":"${{ steps.typecheck.outcome }}","GUARD-PRODUCTION-BUILD":"${{ steps.production-build.outcome }}"}
        run: node scripts/shoperation-verification-checkpoint.mjs --check

      - name: Completion Truth Gate
        if: always() && github.event_name == 'pull_request'
        id: completion-truth
        env:
          SHOPERATION_TRUTH_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SHOPERATION_TRUTH_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          SHOPERATION_TRUTH_STATE_VERSION: shoporation-ci.v1
          SHOPERATION_TRUTH_EVIDENCE_MANIFEST: artifacts/shoperation-development-guard/final-evidence-manifest.json
          SHOPERATION_TRUTH_CHECKPOINT: artifacts/shoperation-verification-cache/checkpoint.json
          SHOPERATION_TRUTH_EVIDENCE_JSON: >-
            [{"id":"GUARD-KNOWLEDGE-PREFLIGHT","status":"${{ steps.knowledge.outcome }}","sourceCommit":"${{ github.event.pull_request.head.sha || github.sha }}","branch":"${{ github.event.pull_request.head.ref || github.ref_name }}","stateVersion":"shoporation-ci.v1","runId":"${{ github.run_id }}-${{ github.run_attempt }}"},{"id":"GUARD-PLAN-BEFORE-CODE","status":"${{ steps.development-plan.outcome }}","sourceCommit":"${{ github.event.pull_request.head.sha || github.sha }}","branch":"${{ github.event.pull_request.head.ref || github.ref_name }}","stateVersion":"shoporation-ci.v1","runId":"${{ github.run_id }}-${{ github.run_attempt }}"},{"id":"GUARD-EDIT-TIME","status":"${{ steps.edit-time-guard.outcome }}","sourceCommit":"${{ github.event.pull_request.head.sha || github.sha }}","branch":"${{ github.event.pull_request.head.ref || github.ref_name }}","stateVersion":"shoporation-ci.v1","runId":"${{ github.run_id }}-${{ github.run_attempt }}"},{"id":"GUARD-INCREMENTAL-REPLAY","status":"${{ steps.incremental-replay.outcome }}","sourceCommit":"${{ github.event.pull_request.head.sha || github.sha }}","branch":"${{ github.event.pull_request.head.ref || github.ref_name }}","stateVersion":"shoporation-ci.v1","runId":"${{ github.run_id }}-${{ github.run_attempt }}"},{"id":"GUARD-RELEASE-RISK","status":"${{ steps.release-risk.outcome }}","sourceCommit":"${{ github.event.pull_request.head.sha || github.sha }}","branch":"${{ github.event.pull_request.head.ref || github.ref_name }}","stateVersion":"shoporation-ci.v1","runId":"${{ github.run_id }}-${{ github.run_attempt }}"},{"id":"GUARD-QUALITY-TESTS","status":"${{ steps.quality-tests.outcome }}","sourceCommit":"${{ github.event.pull_request.head.sha || github.sha }}","branch":"${{ github.event.pull_request.head.ref || github.ref_name }}","stateVersion":"shoporation-ci.v1","runId":"${{ github.run_id }}-${{ github.run_attempt }}"},{"id":"GUARD-TYPECHECK","status":"${{ steps.typecheck.outcome }}","sourceCommit":"${{ github.event.pull_request.head.sha || github.sha }}","branch":"${{ github.event.pull_request.head.ref || github.ref_name }}","stateVersion":"shoporation-ci.v1","runId":"${{ github.run_id }}-${{ github.run_attempt }}"},{"id":"GUARD-PRODUCTION-BUILD","status":"${{ steps.production-build.outcome }}","sourceCommit":"${{ github.event.pull_request.head.sha || github.sha }}","branch":"${{ github.event.pull_request.head.ref || github.ref_name }}","stateVersion":"shoporation-ci.v1","runId":"${{ github.run_id }}-${{ github.run_attempt }}"}]
        run: node scripts/shoperation-truth-gate.mjs --check

      - name: Save Resumable Verification checkpoint
        if: always() && github.event_name == 'pull_request' && steps.verification-finalize.outcome == 'success' && steps.completion-truth.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: artifacts/shoperation-verification-cache/checkpoint.json
          key: shoperation-verification-v1-${{ runner.os }}-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

      - name: Upload Resumable Verification evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: shoperation-resumable-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/shoperation-development-guard/resumable-verification-plan.json
            artifacts/shoperation-development-guard/final-evidence-manifest.json
            artifacts/shoperation-development-guard/resumable-verification-summary.md
            artifacts/shoperation-verification-cache/checkpoint.json
            artifacts/shoperation-development-guard/truth-gate.json
            artifacts/shoperation-development-guard/truth-gate.md
          if-no-files-found: warn
          retention-days: 30

      - name: Generate release manifest
        id: release-manifest
        env:
          DEPLOY_ENVIRONMENT: ci
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RELEASE_REF_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: npm run release:manifest

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Create Shoperation failure intake
        if: always()
        shell: bash
        env:
          KNOWLEDGE_OUTCOME: ${{ steps.knowledge.outcome }}
          DEVELOPMENT_PLAN_OUTCOME: ${{ steps.development-plan.outcome }}
          EDIT_GUARD_OUTCOME: ${{ steps.edit-time-guard.outcome }}
          INCREMENTAL_OUTCOME: ${{ steps.incremental-replay.outcome }}
          RISK_OUTCOME: ${{ steps.release-risk.outcome }}
          BASELINE_OUTCOME: ${{ steps.customer-baseline-guard.outcome }}
          MARKET_READY_OUTCOME: ${{ steps.market-ready.outcome }}
          QUALITY_OUTCOME: ${{ steps.quality-tests.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.production-build.outcome }}
          MANIFEST_OUTCOME: ${{ steps.release-manifest.outcome }}
          TRUTH_OUTCOME: ${{ steps.completion-truth.outcome }}
          SHOPERATION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SHOPERATION_FAILURE_SOURCE: ci
          SHOPERATION_ENVIRONMENT: ci
          SHOPERATION_CI_RUN_ID: ${{ github.run_id }}
          SHOPERATION_CI_WORKFLOW: ${{ github.workflow }}
          SHOPERATION_DIAGNOSTIC_ARTIFACTS: >-
            KNOWLEDGE_PREFLIGHT_FAILED=artifacts/shoperation-quality/knowledge-preflight.json;
            DEVELOPMENT_PLAN_FAILED=artifacts/shoperation-development-guard/plan-before-code.json;
            EDIT_TIME_GUARD_FAILED=artifacts/shoperation-development-guard/edit-time-guard.json;
            INCREMENTAL_REPLAY_FAILED=artifacts/shoperation-development-guard/incremental-replay.json;
            RELEASE_RISK_BUDGET_FAILED=artifacts/release-risk-budget.json;
            CUSTOMER_BASELINE_GUARD_FAILED=artifacts/shoperation-command-diagnostics/customer-baseline.json;
            MARKET_READY_GATE_FAILED=artifacts/shoperation-command-diagnostics/market-ready.json;
            TEST_FAILED=artifacts/test-results.json;
            TYPECHECK_FAILED=artifacts/shoperation-command-diagnostics/typecheck.json;
            BUILD_FAILED=artifacts/shoperation-command-diagnostics/production-build.json;
            TRUTH_GATE_FAILED=artifacts/shoperation-development-guard/truth-gate.json;
            RELEASE_MANIFEST_FAILED=artifacts/release-manifest-diagnostic.json
        run: |
          codes=""
          [ "$KNOWLEDGE_OUTCOME" != "failure" ] || codes="${codes}KNOWLEDGE_PREFLIGHT_FAILED;"
          [ "$DEVELOPMENT_PLAN_OUTCOME" != "failure" ] || codes="${codes}DEVELOPMENT_PLAN_FAILED;"
          [ "$EDIT_GUARD_OUTCOME" != "failure" ] || codes="${codes}EDIT_TIME_GUARD_FAILED;"
          [ "$INCREMENTAL_OUTCOME" != "failure" ] || codes="${codes}INCREMENTAL_REPLAY_FAILED;"
          [ "$RISK_OUTCOME" != "failure" ] || codes="${codes}RELEASE_RISK_BUDGET_FAILED;"
          [ "$BASELINE_OUTCOME" != "failure" ] || codes="${codes}CUSTOMER_BASELINE_GUARD_FAILED;"
          [ "$MARKET_READY_OUTCOME" != "failure" ] || codes="${codes}MARKET_READY_GATE_FAILED;"
          [ "$QUALITY_OUTCOME" != "failure" ] || codes="${codes}TEST_FAILED;"
          [ "$TYPECHECK_OUTCOME" != "failure" ] || codes="${codes}TYPECHECK_FAILED;"
          [ "$BUILD_OUTCOME" != "failure" ] || codes="${codes}BUILD_FAILED;"
          [ "$TRUTH_OUTCOME" != "failure" ] || codes="${codes}TRUTH_GATE_FAILED;"
          [ "$MANIFEST_OUTCOME" != "failure" ] || codes="${codes}RELEASE_MANIFEST_FAILED;"
          SHOPERATION_GENERIC_FAILURES="$codes" node scripts/shoperation-failure-intake.mjs

      - name: Upload Shoperation failure intake
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoperation-failure-intake-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/shoperation-failure-intake/**
            artifacts/shoperation-command-diagnostics/**
            artifacts/release-manifest-diagnostic.json
            artifacts/shoperation-development-guard/truth-gate.*
          if-no-files-found: warn
          retention-days: 90

      - name: Persist unresolved failure intake
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const file='artifacts/shoperation-failure-intake/failure-intake.json';
            if(!fs.existsSync(file))return;
            const report=JSON.parse(fs.readFileSync(file,'utf8'));
            const unresolved=(report.records||[]).filter(r=>['candidate-new-failure','needs-review'].includes(r.classificationStatus));
            if(!unresolved.length)return;
            const open=await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',per_page:100});
            for(const record of unresolved){
              const identity=record.failureFingerprint||record.candidateId;
              const marker=`<!-- shoperation-failure-intake:${identity} -->`;
              if(open.some(issue=>(issue.body||'').includes(marker)))continue;
              await github.rest.issues.create({...context.repo,title:`[Quality intake] ${identity}: ${record.rawErrorCode}`,body:`${marker}\n\nContract: \`shoporation.failure-intake.v2\`\n\nFingerprint: \`${record.failureFingerprint||'unknown'}\`\n\nSource commit: \`${record.sourceCommit||'unknown'}\`\n\nCI run: \`${record.ciRunId||'unknown'}\`\n\nSource: \`${record.failureSource}\`\n\nGate: \`${record.gate||record.gateCode||'unknown'}\`\n\nClassification: \`${record.classificationStatus}\`\n\nReason: ${record.reason||record.symptom}\n\nLocation: ${record.file||record.route||record.endpoint||'not localized'}\n\nThis issue remains open until the failure is matched, promoted, scoped, deduplicated or rejected with an explicit disposition.`});
            }

  fresh-install-proof:
    if: (github.ref == 'refs/heads/core-engine-2-batch' || github.ref == 'refs/heads/production-provisioning-acceptance' || github.ref == 'refs/heads/feature/roadmap-block24-commercial-security-maturity' || startsWith(github.ref, 'refs/heads/roadmap/') || startsWith(github.ref, 'refs/heads/feature/')) && github.event_name == 'push' && contains(github.event.head_commit.message, '[fresh-install-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHOPERATION_FRESH_INSTALL_DB_URL: ${{ secrets.SHOPERATION_FRESH_INSTALL_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Fresh Install secret
        id: fresh-secret
        shell: bash
        run: |
          if [ -z "$SHOPERATION_FRESH_INSTALL_DB_URL" ]; then
            echo "SHOPERATION_FRESH_INSTALL_DB_URL repository secret is missing."
            exit 1
          fi

      - name: Verify reviewed baseline lifecycle
        id: fresh-baseline
        shell: bash
        run: |
          node -e "const m=require('./supabase/customer-baseline/manifest.json'); if(m.status!=='snapshot-reviewed'||m.freshInstallProofRequired!==true){throw new Error('baseline must be snapshot-reviewed and still require Fresh Install proof')}"
          test -s supabase/customer-baseline/migrations/0001_shoperation_v1_schema.sql
          test -s supabase/customer-baseline/migrations/0002_block7_b2b_account_ownership.sql

      - name: Fresh target preflight
        id: fresh-preflight
        shell: bash
        run: psql "$SHOPERATION_FRESH_INSTALL_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/customer-baseline/target-preflight.sql

      - name: Apply reviewed baseline atomically
        id: fresh-apply
        shell: bash
        run: |
          {
            echo 'BEGIN;'
            while IFS= read -r migration; do cat "$migration"; done < <(find supabase/customer-baseline/migrations -maxdepth 1 -type f -name '*.sql' | sort)
            cat supabase/customer-baseline/auth-bootstrap.sql
            cat supabase/customer-baseline/seed.sql
            echo 'COMMIT;'
          } | psql "$SHOPERATION_FRESH_INSTALL_DB_URL" -X -v ON_ERROR_STOP=1

      - name: Fresh target postflight
        id: fresh-postflight
        shell: bash
        run: psql "$SHOPERATION_FRESH_INSTALL_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/customer-baseline/target-postflight.sql

      - name: Compute proof contract hash
        id: fresh-contract-hash
        shell: bash
        run: |
          hash="$(node scripts/customer-baseline-contract-hash.mjs)"
          echo "Proof contract SHA256: $hash"
          echo "value=$hash" >> "$GITHUB_OUTPUT"

      - name: Record structured Fresh Install proof
        id: fresh-proof-record
        env:
          PROOF_CONTRACT_SHA256: ${{ steps.fresh-contract-hash.outputs.value }}
        shell: bash
        run: |
          mkdir -p artifacts/fresh-install-proof
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const manifest=JSON.parse(fs.readFileSync('supabase/customer-baseline/manifest.json','utf8'));
          const migrationFiles=fs.readdirSync(manifest.baselineMigrationDirectory)
            .filter(name=>name.endsWith('.sql'))
            .sort()
            .map(name=>path.posix.join(manifest.baselineMigrationDirectory,name));
          const proof={
            contract:'shoporation.fresh-install-proof.v2',
            repository:process.env.GITHUB_REPOSITORY,
            sourceCommit:process.env.GITHUB_SHA,
            ciRunId:process.env.GITHUB_RUN_ID,
            ciWorkflow:process.env.GITHUB_WORKFLOW,
            environment:'fresh-install-disposable',
            generatedAt:new Date().toISOString(),
            baselineStatus:manifest.status,
            freshInstallProofRequired:manifest.freshInstallProofRequired,
            proofContractSha256:process.env.PROOF_CONTRACT_SHA256,
            migrationFiles,
            authBootstrapFile:manifest.authBootstrapFile,
            seedFile:manifest.seedFile,
            checks:{
              targetPreflight:'PASS',
              orderedMigrations:'PASS',
              authBootstrap:'PASS',
              neutralSeed:'PASS',
              targetPostflight:'PASS',
            },
            productionTouched:false,
            decision:'PASS',
          };
          fs.writeFileSync('artifacts/fresh-install-proof/proof.json',JSON.stringify(proof,null,2)+'\n');
          NODE

      - name: Record proof summary
        shell: bash
        run: |
          {
            echo '## Shoperation Fresh Install proof'
            echo ''
            echo '- Target preflight: passed'
            echo '- Reviewed snapshot + forward migrations: applied atomically'
            echo '- Supabase Auth bootstrap: applied'
            echo '- Neutral seed: applied'
            echo '- Target postflight: passed'
            echo '- Production: untouched by this job'
            echo "- Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record Fresh Install failure diagnostic
        id: fresh-failure
        if: always()
        env:
          SECRET_OUTCOME: ${{ steps.fresh-secret.outcome }}
          BASELINE_OUTCOME: ${{ steps.fresh-baseline.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.fresh-preflight.outcome }}
          APPLY_OUTCOME: ${{ steps.fresh-apply.outcome }}
          POSTFLIGHT_OUTCOME: ${{ steps.fresh-postflight.outcome }}
          HASH_OUTCOME: ${{ steps.fresh-contract-hash.outcome }}
          PROOF_OUTCOME: ${{ steps.fresh-proof-record.outcome }}
        shell: bash
        run: |
          mkdir -p artifacts/fresh-install-proof
          node <<'NODE'
          const fs=require('fs');
          const map=[
            ['FRESH_INSTALL_SECRET_REQUIRED','Verify Fresh Install secret',process.env.SECRET_OUTCOME,'configured disposable DB secret'],
            ['FRESH_INSTALL_BASELINE_LIFECYCLE_FAILED','Verify reviewed baseline lifecycle',process.env.BASELINE_OUTCOME,'snapshot-reviewed baseline requiring proof'],
            ['FRESH_INSTALL_TARGET_PREFLIGHT_FAILED','Fresh target preflight',process.env.PREFLIGHT_OUTCOME,'clean disposable target'],
            ['FRESH_INSTALL_MIGRATION_APPLY_FAILED','Apply reviewed baseline atomically',process.env.APPLY_OUTCOME,'ordered baseline applies atomically'],
            ['FRESH_INSTALL_TARGET_POSTFLIGHT_FAILED','Fresh target postflight',process.env.POSTFLIGHT_OUTCOME,'final schema and privilege contract passes'],
            ['FRESH_INSTALL_CONTRACT_HASH_FAILED','Compute proof contract hash',process.env.HASH_OUTCOME,'proof contract hash generated'],
            ['FRESH_INSTALL_PROOF_RECORD_FAILED','Record structured Fresh Install proof',process.env.PROOF_OUTCOME,'exact-head proof artifact written'],
          ];
          const errors=map.filter(([, ,outcome])=>outcome==='failure').map(([code,step,actual,expected])=>({
            code,
            reason:`${step} failed`,
            expected,
            actual,
            evidence:[`step=${step}`],
            status:'FAIL',
          }));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`has_failure=${errors.length?'true':'false'}\n`);
          if(!errors.length)process.exit(0);
          const report={
            contract:'shoporation.fresh-install-failure.v1',
            repository:process.env.GITHUB_REPOSITORY,
            sourceCommit:process.env.GITHUB_SHA,
            ciRunId:process.env.GITHUB_RUN_ID,
            ciWorkflow:process.env.GITHUB_WORKFLOW,
            environment:'fresh-install-disposable',
            generatedAt:new Date().toISOString(),
            errors,
            decision:'FAIL',
          };
          fs.writeFileSync('artifacts/fresh-install-proof/failure.json',JSON.stringify(report,null,2)+'\n');
          NODE

      - name: Upload exact-head Fresh Install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-proof-${{ github.sha }}
          path: artifacts/fresh-install-proof/**
          if-no-files-found: error
          retention-days: 90

      - name: Create Fresh Install failure intake
        if: always() && steps.fresh-failure.outputs.has_failure == 'true'
        env:
          SHOPERATION_SOURCE_COMMIT: ${{ github.sha }}
          SHOPERATION_FAILURE_SOURCE: fresh-install
          SHOPERATION_ENVIRONMENT: fresh-install-disposable
          SHOPERATION_CI_RUN_ID: ${{ github.run_id }}
          SHOPERATION_CI_WORKFLOW: ${{ github.workflow }}
          SHOPERATION_DIAGNOSTIC_ARTIFACTS: FRESH_INSTALL_FAILED=artifacts/fresh-install-proof/failure.json
          SHOPERATION_GENERIC_FAILURES: FRESH_INSTALL_FAILED
        run: node scripts/shoperation-failure-intake.mjs

      - name: Upload Fresh Install failure intake
        if: always() && steps.fresh-failure.outputs.has_failure == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-failure-intake-${{ github.sha }}
          path: artifacts/shoperation-failure-intake/**
          if-no-files-found: error
          retention-days: 90

      - name: Persist unresolved Fresh Install failure intake
        if: always() && steps.fresh-failure.outputs.has_failure == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const file='artifacts/shoperation-failure-intake/failure-intake.json';
            if(!fs.existsSync(file))return;
            const report=JSON.parse(fs.readFileSync(file,'utf8'));
            const unresolved=(report.records||[]).filter(r=>['candidate-new-failure','needs-review'].includes(r.classificationStatus));
            if(!unresolved.length)return;
            const open=await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',per_page:100});
            for(const record of unresolved){
              const identity=record.failureFingerprint||record.candidateId;
              const marker=`<!-- shoperation-failure-intake:${identity} -->`;
              if(open.some(issue=>(issue.body||'').includes(marker)))continue;
              await github.rest.issues.create({...context.repo,title:`[Quality intake] ${identity}: ${record.rawErrorCode}`,body:`${marker}\n\nContract: \`shoporation.failure-intake.v2\`\n\nFingerprint: \`${record.failureFingerprint||'unknown'}\`\n\nSource commit: \`${record.sourceCommit||'unknown'}\`\n\nCI run: \`${record.ciRunId||'unknown'}\`\n\nSource: \`${record.failureSource}\`\n\nGate: \`${record.gate||record.gateCode||'unknown'}\`\n\nClassification: \`${record.classificationStatus}\`\n\nReason: ${record.reason||record.symptom}\n\nLocation: ${record.file||record.route||record.endpoint||'not localized'}\n\nThis issue remains open until the failure is matched, promoted, scoped, deduplicated or rejected with an explicit disposition.`});
            }
