name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Customer database baseline guard
        run: npm run db:customer:guard

      - name: Prepare quality artifacts
        run: mkdir -p artifacts

      - name: Quality tests
        run: npm test

      - name: Upload quality test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-test-results
          path: artifacts/test-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Generate release manifest
        env:
          DEPLOY_ENVIRONMENT: ci
        run: npm run release:manifest

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30
