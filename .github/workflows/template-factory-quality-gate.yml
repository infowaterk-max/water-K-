      - 'src/components/auth/storefront-auth-dialog.tsx'
      - 'src/components/auth/storefront-auth-dialog.module.css'
      - 'src/app/api/storefront/auth-context/**'
      - 'src/app/penztar/**'
      - 'src/components/checkout/**'
      - 'src/app/kosar/**'
      - 'src/components/cart/**'
      - 'src/lib/account/**'
      - 'src/app/api/orders/**'
      - 'src/app/api/account/billing-profile/**'
      - 'src/app/api/account/b2b/identity/**'
      - 'src/app/api/admin/b2b/identity-requests/**'
      - 'src/app/admin/ugyfelek/b2b/**'
      - 'supabase/migrations/20260922053000_shared_customer_billing_b2b_identity_reverification.sql'
      - 'supabase/customer-baseline/migrations/0044_shared_customer_billing_b2b_identity_reverification.sql'
      - 'docs/support/SHARED_CUSTOMER_BILLING_AND_B2B_IDENTITY_AUTHORITY_2026-09-22.md'
      - 'src/components/analytics/cookie-consent.tsx'
      - 'src/components/account/storefront-account-shell.tsx'
      - 'src/app/fiokom/**'
      - 'src/app/account-workflow.css'
      - 'src/components/content/storefront-content-shell.tsx'
      - 'src/app/oldal/**'
      - 'src/app/gyik/**'
      - 'src/app/webaruhaz/**'
      - 'src/components/catalog/**'
      - 'src/app/public-pages-polish.css'
      - 'src/app/v6.css'
      - 'src/app/final-ux-audit.css'
      - 'src/app/responsive-final.css'
      - 'src/components/admin/storefront-visual-builder-v3.tsx'
      - 'src/app/visual-fidelity-qa/**'
      - 'src/app/admin/beallitasok/megjelenes/**'
      - 'src/app/api/visual-fidelity/templates/**'
      - 'src/app/storefront-template-preview/**'
      - 'supabase/migrations/20260921152000_storefront_social_links_settings.sql'
      - 'supabase/migrations/20260921161000_storefront_social_links_domain_hardening.sql'
      - 'supabase/customer-baseline/migrations/0040_storefront_social_links_settings.sql'
      - 'supabase/customer-baseline/migrations/0041_storefront_social_links_domain_hardening.sql'
      - 'supabase/migrations/20260921164500_customer_account_browser_grants.sql'
      - 'supabase/customer-baseline/migrations/0042_customer_account_browser_grants.sql'
      - 'docs/support/STOREFRONT_SOCIAL_LINKS_TENANT_AUTHORITY_2026-09-21.md'
      - 'scripts/template-factory-quality-gate.mjs'
      - 'scripts/promote-template-golden-baseline.mjs'
      - '.github/workflows/template-golden-baseline-promotion.yml'
      - 'tests/**storefront**'
      - 'tests/**template-factory**'
      - 'tests/**playroom**'
      - '.github/workflows/template-factory-quality-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: template-factory-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VISUAL_FIDELITY_QA: '1'
      VISUAL_FIDELITY_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TEMPLATE_QUALITY_OUTPUT_DIR: artifacts/template-factory-quality
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund

      - name: Knowledge Before Build preflight
        id: knowledge
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/shoperation-knowledge-preflight.mjs

      - name: Plan Before Code Gate
        if: github.event_name == 'pull_request'
        id: development-plan
        env:
          DEVELOPMENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEVELOPMENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/shoperation-plan-before-code.mjs --check

      - name: Edit-Time Known Failure Guard
        if: github.event_name == 'pull_request'
        id: edit-time-guard
        run: node scripts/shoperation-edit-time-guard.mjs --check

      - name: Incremental Known Failure Replay
        id: incremental-replay
        run: node scripts/shoperation-incremental-replay.mjs --check

      - name: Upload Development Guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoperation-development-guard-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/shoperation-development-guard/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Shoperation knowledge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoperation-quality-knowledge-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/shoperation-quality/**
          if-no-files-found: warn
          retention-days: 30

      - name: Install pinned QA dependencies without changing lock authority
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0 pixelmatch@7.1.0 pngjs@7.0.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Template Factory contract regressions
        run: >
          npx vitest run
          tests/storefront-template-quality-gate-v2.test.ts
          tests/template-factory-scaffold-v1.test.ts
          tests/template-factory-loot-vault-v2.test.ts
          tests/storefront-template-factory-workflow-coverage.test.ts
          tests/storefront-responsive-isolation.test.ts
          tests/storefront-visual-style-capabilities.test.ts
          tests/storefront-fidelity-typography.test.ts
          tests/storefront-visual-builder-fidelity-operations.test.ts
          tests/storefront-fidelity-layout.test.ts
          tests/storefront-responsive-layout-depth.test.ts
          tests/visual-builder-workspace-ui.test.ts
          tests/roadmap-catchup-foundation.test.ts
          tests/storefront-runtime-backbone.test.tsx
          tests/special-commerce-wave6-cross-engine-acceptance.test.ts
          tests/special-commerce-wave7-template2-adoption.test.ts
          tests/storefront-targeted-page-change.test.ts
          tests/pilot-acceptance-access.test.ts
          tests/storefront-real-route-template-authority.test.ts
          tests/storefront-product-route-authority.test.ts
          tests/storefront-preview-demo-content-routing.test.ts
          tests/storefront-form-wizard-engine.test.ts
          tests/storefront-auth-surface.test.ts
          tests/storefront-auth-intent-checkout.test.ts
          tests/storefront-auth-return-target.test.ts
          tests/storefront-guest-order-claim.test.ts
          tests/storefront-shared-commerce-account-hardening.test.ts
          tests/storefront-public-information-routes.test.ts
          tests/storefront-catalog-discovery-route.test.ts
          tests/customer-account-runtime-hardening.test.ts
          tests/storefront-system-surfaces.test.ts
          tests/storefront-social-settings.test.ts
          tests/storefront-template-preview-runtime.test.ts
          tests/storefront-visual-builder-fidelity-engine.test.ts
          tests/playroom-v20-canonical-shell-content.test.ts
          tests/storefront-playroom-v20-canonical-authority.test.ts
          tests/storefront-playroom-v20-functional-acceptance.test.ts
          tests/storefront-template-route-integrity.test.ts
          tests/storefront-template-demo-content-persistence.test.ts
          tests/storefront-account-capability-navigation.test.tsx
          tests/storefront-commerce-header.test.tsx
          tests/storefront-runtime-primitives.test.tsx
          tests/cart-style-quantity-control.test.tsx

      - name: Typecheck exact head
        id: typecheck
        run: npm run typecheck

      - name: Build exact-head Runtime
        id: runtime-build
        run: npm run build

      - name: Start exact-head QA Runtime
        shell: bash
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/template-factory-quality-next.log 2>&1 &
          echo $! > /tmp/template-factory-quality-next.pid
          for attempt in $(seq 1 75); do
            if curl --fail --silent --show-error 'http://127.0.0.1:3000/api/visual-fidelity/templates' > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/template-factory-quality-next.log
          exit 1

      - name: Run Template Factory 14x3 browser matrix
        id: browser-matrix
        run: node scripts/template-factory-quality-gate.mjs

      - name: Upload Template Factory quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-factory-quality-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/template-factory-quality/*.png
            artifacts/template-factory-quality/manifest.json
          if-no-files-found: warn
          retention-days: 30


      - name: Resolve exact-head Vercel preview for Product Owner proof
        if: (github.event_name == 'push' && (startsWith(github.ref_name, 'feature/template-factory-product-owner-') || github.ref_name == 'feature/template-factory-vercel-automation-bypass' || github.ref_name == 'feature/template-factory-storefront-contract-hardening')) || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/template-factory-product-owner-') || github.head_ref == 'feature/template-factory-vercel-automation-bypass' || github.head_ref == 'feature/template-factory-storefront-contract-hardening'))
        id: product-owner-preview
        uses: actions/github-script@v7
        with:
          script: |
            const sleep=(ms)=>new Promise(resolve=>setTimeout(resolve,ms));
            const {owner,repo}=context.repo;
            const sha=context.payload.pull_request?.head?.sha??context.sha;
            for(let attempt=0;attempt<90;attempt+=1){
              const deployments=await github.paginate(
                github.rest.repos.listDeployments,
                {owner,repo,sha,per_page:100},
              );
              for(const deployment of deployments){
                const statuses=await github.paginate(
                  github.rest.repos.listDeploymentStatuses,
                  {owner,repo,deployment_id:deployment.id,per_page:100},
                );
                const ready=statuses.find(status=>{
                  if(status.state!=='success'||!status.environment_url)return false;
                  try{return new URL(status.environment_url).hostname.endsWith('.vercel.app')}catch{return false}
                });
                if(ready){
                  core.info(`Exact-head Vercel preview ready for ${sha}.`);
                  core.setOutput('base-url',new URL(ready.environment_url).origin);
                  return;
                }
              }
              const combined=await github.rest.repos.getCombinedStatusForRef({owner,repo,ref:sha});
              const vercel=combined.data.statuses.find(status=>status.context==='Vercel');
              if(vercel&&['failure','error'].includes(vercel.state)){
                throw new Error(`EXACT_HEAD_VERCEL_DEPLOYMENT_${vercel.state.toUpperCase()}`);
              }
              if(vercel?.state==='success'){
                core.info('GitHub deployment status is successful; using the protected proof-branch alias with exact source-commit verification.');
                core.setOutput('base-url','https://water-k-native-git-feature-template-fact-a56b5f-infowaterk-5067.vercel.app');
                return;
              }
              await sleep(5000);
            }
            core.setFailed('EXACT_HEAD_VERCEL_PREVIEW_NOT_READY');

      - name: Prove exact-head Product Owner login journey
        id: product-owner-handoff
        if: (github.event_name == 'push' && (startsWith(github.ref_name, 'feature/template-factory-product-owner-') || github.ref_name == 'feature/template-factory-vercel-automation-bypass' || github.ref_name == 'feature/template-factory-storefront-contract-hardening')) || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/template-factory-product-owner-') || github.head_ref == 'feature/template-factory-vercel-automation-bypass' || github.head_ref == 'feature/template-factory-storefront-contract-hardening'))
        env:
          PRODUCT_OWNER_PREVIEW_URL: "${{ steps.product-owner-preview.outputs.base-url }}/storefront-template-preview?template=gaming.loot-vault&version=2&page=home&viewport=desktop&factory=1"
          PRODUCT_OWNER_TEMPLATE_KEY: gaming.loot-vault
          PRODUCT_OWNER_TEMPLATE_VERSION: '2'
          PRODUCT_OWNER_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PRODUCT_OWNER_TEST_EMAIL: ${{ secrets.PRODUCT_OWNER_TEST_EMAIL }}
          PRODUCT_OWNER_TEST_PASSWORD: ${{ secrets.PRODUCT_OWNER_TEST_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TEMPLATE_QUALITY_MANIFEST: artifacts/template-factory-quality/manifest.json
          TEMPLATE_HANDOFF_OUTPUT_DIR: artifacts/template-factory-handoff
        run: node scripts/template-factory-product-owner-handoff.mjs

      - name: Upload Product Owner journey proof
        if: always() && (github.event_name == 'push' && (startsWith(github.ref_name, 'feature/template-factory-product-owner-') || github.ref_name == 'feature/template-factory-vercel-automation-bypass' || github.ref_name == 'feature/template-factory-storefront-contract-hardening')) || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/template-factory-product-owner-') || github.head_ref == 'feature/template-factory-vercel-automation-bypass' || github.head_ref == 'feature/template-factory-storefront-contract-hardening'))
        uses: actions/upload-artifact@v4
        with:
          name: template-factory-handoff-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/template-factory-handoff/**
          if-no-files-found: warn
          retention-days: 30

      - name: Create Template Factory failure intake
        if: always()
        shell: bash
        env:
          KNOWLEDGE_OUTCOME: ${{ steps.knowledge.outcome }}
          DEVELOPMENT_PLAN_OUTCOME: ${{ steps.development-plan.outcome }}
          EDIT_GUARD_OUTCOME: ${{ steps.edit-time-guard.outcome }}
          INCREMENTAL_OUTCOME: ${{ steps.incremental-replay.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.runtime-build.outcome }}
          MATRIX_OUTCOME: ${{ steps.browser-matrix.outcome }}
          SHOPERATION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SHOPERATION_FAILURE_SOURCE: template-factory
          SHOPERATION_TEMPLATE_KEY: gaming.loot-vault
          SHOPERATION_TEMPLATE_VERSION: '2'
          SHOPERATION_TEMPLATE_QUALITY_MANIFEST: artifacts/template-factory-quality/manifest.json
        run: |
          codes=""
          [ "$KNOWLEDGE_OUTCOME" != "failure" ] || codes="${codes}KNOWLEDGE_PREFLIGHT_FAILED;"
          [ "$DEVELOPMENT_PLAN_OUTCOME" != "failure" ] || codes="${codes}DEVELOPMENT_PLAN_FAILED;"
          [ "$EDIT_GUARD_OUTCOME" != "failure" ] || codes="${codes}EDIT_TIME_GUARD_FAILED;"
          [ "$INCREMENTAL_OUTCOME" != "failure" ] || codes="${codes}INCREMENTAL_REPLAY_FAILED;"
          [ "$TYPECHECK_OUTCOME" != "failure" ] || codes="${codes}TYPECHECK_FAILED;"
          [ "$BUILD_OUTCOME" != "failure" ] || codes="${codes}BUILD_FAILED;"
          [ "$MATRIX_OUTCOME" != "failure" ] || codes="${codes}QUALITY_GATE_FAILED;"
          SHOPERATION_GENERIC_FAILURES="$codes" node scripts/shoperation-failure-intake.mjs

      - name: Upload Template Factory failure intake
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-factory-failure-intake-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/shoperation-failure-intake/**
          if-no-files-found: warn
          retention-days: 90

      - name: Persist unresolved failure intake
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const file='artifacts/shoperation-failure-intake/failure-intake.json';
            if(!fs.existsSync(file))return;
            const report=JSON.parse(fs.readFileSync(file,'utf8'));
            const unresolved=(report.records||[]).filter(r=>['candidate-new-failure','needs-review'].includes(r.classificationStatus));
            if(!unresolved.length)return;
            const open=await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',per_page:100});
            for(const record of unresolved){
              const marker=`<!-- shoperation-failure-intake:${record.candidateId} -->`;
              if(open.some(issue=>(issue.body||'').includes(marker)))continue;
              await github.rest.issues.create({...context.repo,title:`[Quality intake] ${record.candidateId}: ${record.rawErrorCode}`,body:`${marker}\n\nContract: \`shoporation.failure-intake.v1\`\n\nSource commit: \`${record.sourceCommit||'unknown'}\`\n\nSource: \`${record.failureSource}\`\n\nClassification: \`${record.classificationStatus}\`\n\nSymptom: ${record.symptom}\n\nThis issue remains open until the failure is matched, promoted, scoped, deduplicated or rejected with an explicit disposition.`});
            }

      - name: Upload QA server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: template-factory-quality-server-log-${{ github.sha }}
          path: /tmp/template-factory-quality-next.log
          if-no-files-found: warn
          retention-days: 14
