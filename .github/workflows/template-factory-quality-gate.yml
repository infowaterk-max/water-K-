permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: template-factory-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VISUAL_FIDELITY_QA: '1'
      VISUAL_FIDELITY_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QUALITY_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      TEMPLATE_QUALITY_OUTPUT_DIR: artifacts/template-factory-quality
      TEMPLATE_QUALITY_PREVIOUS_MANIFEST: artifacts/template-factory-checkpoint/manifest.json
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore Template Factory browser evidence checkpoint
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: artifacts/template-factory-checkpoint/manifest.json
          key: template-factory-browser-v2-${{ runner.os }}-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            template-factory-browser-v2-${{ runner.os }}-pr-${{ github.event.pull_request.number }}-

      - name: Knowledge Before Build preflight
        id: knowledge
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/shoperation-knowledge-preflight.mjs

      - name: Plan Before Code Gate
        if: github.event_name == 'pull_request'
        id: development-plan
        env:
          DEVELOPMENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEVELOPMENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/shoperation-plan-before-code.mjs --check

      - name: Edit-Time Known Failure Guard
        if: github.event_name == 'pull_request'
        id: edit-time-guard
        run: node scripts/shoperation-edit-time-guard.mjs --check

      - name: Incremental Known Failure Replay
        id: incremental-replay
        run: node scripts/shoperation-incremental-replay.mjs --check

      - name: Upload Development Guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoperation-development-guard-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/shoperation-development-guard/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Shoperation knowledge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoperation-quality-knowledge-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/shoperation-quality/**
          if-no-files-found: warn
          retention-days: 30

      - name: Install pinned QA dependencies without changing lock authority
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0 pixelmatch@7.1.0 pngjs@7.0.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Template Factory contract regressions
        id: contract-regressions
        run: >
          npx vitest run
          tests/storefront-template-quality-gate-v2.test.ts
          tests/template-factory-scaffold-v1.test.ts
          tests/template-factory-resumable-verification.test.ts
          tests/template-factory-loot-vault-v2.test.ts
          tests/storefront-template-factory-workflow-coverage.test.ts
          tests/storefront-responsive-isolation.test.ts
          tests/storefront-visual-style-capabilities.test.ts
          tests/storefront-fidelity-typography.test.ts
          tests/storefront-visual-builder-fidelity-operations.test.ts
          tests/storefront-fidelity-layout.test.ts
          tests/storefront-responsive-layout-depth.test.ts
          tests/visual-builder-workspace-ui.test.ts
          tests/roadmap-catchup-foundation.test.ts
          tests/storefront-runtime-backbone.test.tsx
          tests/special-commerce-wave6-cross-engine-acceptance.test.ts
          tests/special-commerce-wave7-template2-adoption.test.ts
          tests/storefront-targeted-page-change.test.ts
          tests/pilot-acceptance-access.test.ts
          tests/storefront-real-route-template-authority.test.ts
          tests/storefront-product-route-authority.test.ts
          tests/storefront-preview-demo-content-routing.test.ts
          tests/storefront-form-wizard-engine.test.ts
          tests/storefront-auth-surface.test.ts
          tests/storefront-auth-intent-checkout.test.ts
          tests/storefront-auth-return-target.test.ts
          tests/storefront-guest-order-claim.test.ts
          tests/storefront-shared-commerce-account-hardening.test.ts
          tests/storefront-public-information-routes.test.ts
          tests/storefront-catalog-discovery-route.test.ts
          tests/customer-account-runtime-hardening.test.ts
          tests/storefront-system-surfaces.test.ts
          tests/storefront-social-settings.test.ts
          tests/storefront-template-preview-runtime.test.ts
          tests/storefront-visual-builder-fidelity-engine.test.ts
          tests/playroom-v20-canonical-shell-content.test.ts
          tests/storefront-playroom-v20-canonical-authority.test.ts
          tests/storefront-playroom-v20-functional-acceptance.test.ts
          tests/storefront-template-route-integrity.test.ts
          tests/storefront-template-demo-content-persistence.test.ts
          tests/storefront-account-capability-navigation.test.tsx
          tests/storefront-commerce-header.test.tsx
          tests/storefront-runtime-primitives.test.tsx
          tests/cart-style-quantity-control.test.tsx

      - name: Typecheck exact head
        id: typecheck
        env:
          SHOPERATION_DIAGNOSTIC_CODE: TYPECHECK_FAILED
          SHOPERATION_DIAGNOSTIC_GATE: template-factory-typecheck
          SHOPERATION_DIAGNOSTIC_EXPECTED: exact-head TypeScript check PASS
          SHOPERATION_DIAGNOSTIC_OUTPUT: artifacts/shoperation-command-diagnostics/template-typecheck.json
          SHOPERATION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SHOPERATION_ENVIRONMENT: ci
        run: node scripts/shoperation-command-diagnostic.mjs -- npm run typecheck

      - name: Build exact-head Runtime
        id: runtime-build
        env:
          SHOPERATION_DIAGNOSTIC_CODE: BUILD_FAILED
          SHOPERATION_DIAGNOSTIC_GATE: template-factory-runtime-build
          SHOPERATION_DIAGNOSTIC_EXPECTED: exact-head runtime build PASS
          SHOPERATION_DIAGNOSTIC_OUTPUT: artifacts/shoperation-command-diagnostics/template-runtime-build.json
          SHOPERATION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SHOPERATION_ENVIRONMENT: ci
        run: node scripts/shoperation-command-diagnostic.mjs -- npm run build

      - name: Start exact-head QA Runtime
        id: qa-runtime
        shell: bash
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/template-factory-quality-next.log 2>&1 &
          echo $! > /tmp/template-factory-quality-next.pid
          for attempt in $(seq 1 75); do
            if curl --fail --silent --show-error 'http://127.0.0.1:3000/api/visual-fidelity/templates' > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/template-factory-quality-next.log
          mkdir -p artifacts/shoperation-command-diagnostics
          node <<'NODE'
          const fs=require('fs');
          const raw=fs.existsSync('/tmp/template-factory-quality-next.log')?fs.readFileSync('/tmp/template-factory-quality-next.log','utf8'):'';
          const tail=raw.split(/\r?\n/).filter(Boolean).slice(-12).join(' | ').slice(0,1800);
          fs.writeFileSync('artifacts/shoperation-command-diagnostics/template-qa-runtime.json',JSON.stringify({
            contract:'shoporation.command-diagnostic.v1',
            gateId:'template-factory-qa-runtime',
            decision:'FAIL',
            errors:[{code:'FACTORY_QA_RUNTIME_FAILED',reason:tail||'QA runtime did not become ready before timeout',expected:'QA runtime health endpoint becomes ready',actual:tail||'readiness timeout',evidence:['log=/tmp/template-factory-quality-next.log']}]
          },null,2)+'\n');
          NODE
          exit 1

      - name: Resolve Template Factory live-proof mode
        if: github.event_name == 'pull_request' && steps.qa-runtime.outcome == 'success'
        id: live-proof
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const {pathToFileURL}=require('url');
            const moduleUrl=pathToFileURL(process.cwd()+'/scripts/lib/shoperation-template-factory-resumable-verification.mjs').href;
            const {deriveTemplateLiveRuntimeOrigin}=await import(moduleUrl);
            const registry=JSON.parse(fs.readFileSync('quality/knowledge/guard-registry.v1.json','utf8'));
            const head=context.payload.pull_request?.head?.sha??context.sha;
            const base=context.payload.pull_request?.base?.sha??process.env.QUALITY_BASE_SHA??'';
            const decision=deriveTemplateLiveRuntimeOrigin({registry,baseSha:base,currentHead:head});
            fs.mkdirSync('artifacts/template-factory-quality',{recursive:true});
            fs.writeFileSync('artifacts/template-factory-quality/live-proof-decision.json',JSON.stringify(decision,null,2)+'\n');
            if(decision.decision!=='PASS'){
              core.setFailed('TEMPLATE_LIVE_RUNTIME_ORIGIN_UNPROVEN');
              return;
            }
            core.info('Template Factory runtime target: '+decision.mode+' — '+decision.runtimeSourceCommit+' — '+decision.reason);
            core.setOutput('mode',decision.mode);
            core.setOutput('manifest_mode','LIVE');
            core.setOutput('reason',decision.reason);
            core.setOutput('runtime_sha',decision.runtimeSourceCommit??'');
            core.setOutput('ancestor_proven',String(decision.ancestorProven===true));
            core.setOutput('runtime_equivalence',String(decision.runtimeEquivalenceProven===true));
            core.setOutput('changed_files',JSON.stringify(decision.changedFilesSinceOrigin??[]));
            core.setOutput('affected_inputs',JSON.stringify(decision.affectedInputs??[]));

      - name: Resolve canonical safe Vercel Preview runtime
        if: github.event_name == 'pull_request' && steps.qa-runtime.outcome == 'success' && steps.live-proof.outcome == 'success'
        id: runtime-preview
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const sleep=(ms)=>new Promise(resolve=>setTimeout(resolve,ms));
            const {owner,repo}=context.repo;
            const proofHead=context.payload.pull_request?.head?.sha??context.sha;
            const sha='${{ steps.live-proof.outputs.runtime_sha }}';
            const runtimeMode='${{ steps.live-proof.outputs.mode }}';
            const maxAttempts=runtimeMode==='CURRENT_HEAD'?90:1;
            const fail=(code,reason,actual)=>{
              fs.mkdirSync('artifacts/shoperation-command-diagnostics',{recursive:true});
              fs.writeFileSync('artifacts/shoperation-command-diagnostics/engine-functional-preview.json',JSON.stringify({
                contract:'shoporation.command-diagnostic.v1',
                gateId:'engine-functional-preview',
                decision:'FAIL',
                sourceCommit:proofHead,
                runtimeSourceCommit:sha,
                errors:[{code,reason,expected:'non-production Vercel Preview deployment for the Atlas-selected runtime source with environment URL ready before engine proof',actual:actual??reason,evidence:[`proofHead=${proofHead}`,`runtimeSha=${sha}`]}]
              },null,2)+'\n');
              core.setFailed(code);
            };
            try{
              for(let attempt=0;attempt<maxAttempts;attempt+=1){
                const deployments=await github.paginate(github.rest.repos.listDeployments,{owner,repo,sha,per_page:100});
                for(const deployment of deployments){
                  const environment=String(deployment.environment??'').trim().toLowerCase();
                  const production=deployment.production_environment===true||environment==='production';
                  const explicitPreview=deployment.production_environment!==true&&environment==='preview';
                  if(production||!explicitPreview){
                    core.info(`Rejecting non-preview deployment ${deployment.id} for live proof: environment=${deployment.environment??'unknown'}; production=${String(deployment.production_environment??'unknown')}; runtimeSha=${sha}.`);
                    continue;
                  }
                  const statuses=await github.paginate(github.rest.repos.listDeploymentStatuses,{owner,repo,deployment_id:deployment.id,per_page:100});
                  const ready=statuses.find(status=>{
                    if(status.state!=='success'||!status.environment_url)return false;
                    try{return new URL(status.environment_url).hostname.endsWith('.vercel.app')}catch{return false}
                  });
                  if(ready){
                    core.info(`Vercel runtime deployment ready for E13 proof: proofHead=${proofHead}; runtimeSha=${sha}.`);
                    core.setOutput('base-url',new URL(ready.environment_url).origin);
                    core.setOutput('runtime-source-commit',sha);
                    core.setOutput('deployment-id',String(deployment.id));
                    core.setOutput('environment',String(deployment.environment??'Preview'));
                    return;
                  }
                }
                const combined=await github.rest.repos.getCombinedStatusForRef({owner,repo,ref:sha});
                const vercel=combined.data.statuses.find(status=>status.context==='Vercel');
                if(vercel&&['failure','error'].includes(vercel.state)){
                  fail(`ENGINE_FUNCTIONAL_EXACT_HEAD_VERCEL_${vercel.state.toUpperCase()}`,'Vercel deployment status failed',vercel.state);
                  return;
                }
                await sleep(5000);
              }
              if(runtimeMode==='CURRENT_HEAD')fail('ENGINE_FUNCTIONAL_RUNTIME_PREVIEW_NOT_READY','Current runtime-source Vercel Preview did not expose a ready environment URL before timeout','timeout');
              else fail('ENGINE_FUNCTIONAL_RUNTIME_PREVIEW_ANCHOR_MISSING','No safe non-production Vercel Preview anchor exists for the Atlas-selected equivalent runtime source','preview-anchor-missing');
            }catch(error){
              fail('ENGINE_FUNCTIONAL_RUNTIME_PREVIEW_RESOLUTION_EXCEPTION',error instanceof Error?error.message:String(error),'exception');
            }

      - name: Prove shared E13 engine functionality before visual matrix
        id: engine-functional-proof
        if: github.event_name == 'pull_request' && steps.runtime-preview.outcome == 'success'
        env:
          PRODUCT_OWNER_PREVIEW_URL: "${{ steps.runtime-preview.outputs.base-url }}/platform"
          PRODUCT_OWNER_ENGINE_FUNCTIONAL_ONLY: "true"
          PRODUCT_OWNER_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PRODUCT_OWNER_RUNTIME_SOURCE_COMMIT: ${{ steps.runtime-preview.outputs.runtime-source-commit }}
          PRODUCT_OWNER_TEST_EMAIL: ${{ secrets.PRODUCT_OWNER_TEST_EMAIL }}
          PRODUCT_OWNER_TEST_PASSWORD: ${{ secrets.PRODUCT_OWNER_TEST_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TEMPLATE_HANDOFF_OUTPUT_DIR: artifacts/template-engine-functional-proof
        run: node scripts/template-factory-product-owner-handoff.mjs

      - name: Upload Engine Functional Proof
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: template-engine-functional-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/template-engine-functional-proof/**
          if-no-files-found: warn
          retention-days: 30

      - name: Run scoped Template Factory browser proof (acceptance requires reconciled 14x3)
        id: browser-matrix
        env:
          TEMPLATE_QUALITY_LIVE_PROOF_MODE: ${{ github.event_name == 'pull_request' && steps.live-proof.outputs.manifest_mode || 'NOT_APPLICABLE' }}
          TEMPLATE_QUALITY_LIVE_PROOF_DECISION: artifacts/template-factory-quality/live-proof-decision.json
          TEMPLATE_QUALITY_LIVE_PROOF_REASON: ${{ steps.live-proof.outputs.reason || 'non-pull-request-local-proof' }}
          TEMPLATE_QUALITY_LIVE_PROOF_ORIGIN_SHA: ${{ steps.live-proof.outputs.origin_sha || '' }}
          TEMPLATE_QUALITY_LIVE_PROOF_ORIGIN_RUN_ID: ${{ steps.live-proof.outputs.origin_run_id || '' }}
          TEMPLATE_QUALITY_LIVE_PROOF_ORIGIN_CONCLUSION: ${{ steps.live-proof.outputs.origin_conclusion || '' }}
          TEMPLATE_QUALITY_LIVE_PROOF_ANCESTOR_PROVEN: ${{ steps.live-proof.outputs.ancestor_proven || 'false' }}
          TEMPLATE_QUALITY_LIVE_PROOF_INPUT_EQUIVALENCE: ${{ steps.live-proof.outputs.input_equivalence || 'false' }}
          TEMPLATE_QUALITY_LIVE_PROOF_CHANGED_FILES: ${{ steps.live-proof.outputs.changed_files || '[]' }}
          TEMPLATE_QUALITY_LIVE_PROOF_AFFECTED_INPUTS: ${{ steps.live-proof.outputs.affected_inputs || '[]' }}
        run: node scripts/template-factory-quality-gate.mjs

      - name: Stage Template Factory browser evidence checkpoint
        if: github.event_name == 'pull_request' && steps.browser-matrix.outcome == 'success'
        shell: bash
        run: |
          mkdir -p artifacts/template-factory-checkpoint
          cp artifacts/template-factory-quality/manifest.json artifacts/template-factory-checkpoint/manifest.json

      - name: Save Template Factory browser evidence checkpoint
        if: github.event_name == 'pull_request' && steps.browser-matrix.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: artifacts/template-factory-checkpoint/manifest.json
          key: template-factory-browser-v2-${{ runner.os }}-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

      - name: Resolve Product Owner candidate target
        id: product-owner-target
        if: github.event_name == 'pull_request' && steps.browser-matrix.outcome == 'success'
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('artifacts/template-factory-quality/manifest.json','utf8'));
          const targets=(manifest.acceptanceProofs??[]).filter(item=>
            item.factoryCandidate===true
            &&item.productOwnerReadyByCompiler===true
            &&item.browserMatrixPassed===true
            &&item.proceduralMemoryPassed===true
            &&item.factoryIdentityPinned===true
            &&item.showroomContractPassed===true
            &&item.maturity==='visually-ready'
          );
          if(targets.length>1){
            const actual=targets.map(item=>item.templateKey+'@'+item.templateVersion).join(',');
            fs.mkdirSync('artifacts/shoperation-command-diagnostics',{recursive:true});
            fs.writeFileSync('artifacts/shoperation-command-diagnostics/product-owner-target.json',JSON.stringify({
              contract:'shoporation.command-diagnostic.v1',
              gateId:'product-owner-target',
              decision:'FAIL',
              errors:[{code:'FACTORY_PRODUCT_OWNER_TARGET_AMBIGUOUS',reason:'Multiple Product Owner candidates resolved',expected:'exactly one Product Owner candidate',actual,evidence:['artifact=artifacts/template-factory-quality/manifest.json']}]
            },null,2)+'\n');
            console.error('FACTORY_PRODUCT_OWNER_TARGET_AMBIGUOUS:'+actual);
            process.exit(1);
          }
          const out=process.env.GITHUB_OUTPUT;
          if(!targets.length){
            fs.appendFileSync(out,'ready=false\n');
            process.exit(0);
          }
          const target=targets[0];
          fs.appendFileSync(out,'ready=true\n');
          fs.appendFileSync(out,'template_key='+target.templateKey+'\n');
          fs.appendFileSync(out,'template_version='+target.templateVersion+'\n');
          console.log('Product Owner candidate target:',target.templateKey+'@'+target.templateVersion);
          NODE

      - name: Upload Template Factory quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-factory-quality-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/template-factory-quality/*.png
            artifacts/template-factory-quality/manifest.json
          if-no-files-found: warn
          retention-days: 30


      - name: Prove Product Owner login journey on selected runtime
        id: product-owner-handoff
        if: github.event_name == 'pull_request' && steps.product-owner-target.outputs.ready == 'true' && steps.runtime-preview.outcome == 'success'
        env:
          PRODUCT_OWNER_PREVIEW_URL: "${{ steps.runtime-preview.outputs.base-url }}/storefront-template-preview?template=${{ steps.product-owner-target.outputs.template_key }}&version=${{ steps.product-owner-target.outputs.template_version }}&page=home&viewport=desktop&factory=1"
          PRODUCT_OWNER_TEMPLATE_KEY: "${{ steps.product-owner-target.outputs.template_key }}"
          PRODUCT_OWNER_TEMPLATE_VERSION: "${{ steps.product-owner-target.outputs.template_version }}"
          PRODUCT_OWNER_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PRODUCT_OWNER_RUNTIME_SOURCE_COMMIT: ${{ steps.runtime-preview.outputs.runtime-source-commit }}
          PRODUCT_OWNER_TEST_EMAIL: ${{ secrets.PRODUCT_OWNER_TEST_EMAIL }}
          PRODUCT_OWNER_TEST_PASSWORD: ${{ secrets.PRODUCT_OWNER_TEST_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TEMPLATE_QUALITY_MANIFEST: artifacts/template-factory-quality/manifest.json
          PRODUCT_OWNER_ENGINE_FUNCTIONAL_PROOF: artifacts/template-engine-functional-proof/proof.json
          TEMPLATE_HANDOFF_OUTPUT_DIR: artifacts/template-factory-handoff
        run: node scripts/template-factory-product-owner-handoff.mjs

      - name: Upload Product Owner journey proof
        if: always() && github.event_name == 'pull_request' && steps.product-owner-target.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: template-factory-handoff-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/template-factory-handoff/**
          if-no-files-found: warn
          retention-days: 30

      - name: Create Template Factory failure intake
        if: always()
        shell: bash
        env:
          KNOWLEDGE_OUTCOME: ${{ steps.knowledge.outcome }}
          DEVELOPMENT_PLAN_OUTCOME: ${{ steps.development-plan.outcome }}
          EDIT_GUARD_OUTCOME: ${{ steps.edit-time-guard.outcome }}
          INCREMENTAL_OUTCOME: ${{ steps.incremental-replay.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract-regressions.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.runtime-build.outcome }}
          MATRIX_OUTCOME: ${{ steps.browser-matrix.outcome }}
          QA_RUNTIME_OUTCOME: ${{ steps.qa-runtime.outcome }}
          RUNTIME_PREVIEW_OUTCOME: ${{ steps.runtime-preview.outcome }}
          ENGINE_FUNCTIONAL_OUTCOME: ${{ steps.engine-functional-proof.outcome }}
          TARGET_OUTCOME: ${{ steps.product-owner-target.outcome }}
          HANDOFF_OUTCOME: ${{ steps.product-owner-handoff.outcome }}
          SHOPERATION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SHOPERATION_FAILURE_SOURCE: template-factory
          SHOPERATION_ENVIRONMENT: ci
          SHOPERATION_CI_RUN_ID: ${{ github.run_id }}
          SHOPERATION_CI_WORKFLOW: ${{ github.workflow }}
          SHOPERATION_DIAGNOSTIC_ARTIFACTS: >-
            KNOWLEDGE_PREFLIGHT_FAILED=artifacts/shoperation-quality/knowledge-preflight.json;
            DEVELOPMENT_PLAN_FAILED=artifacts/shoperation-development-guard/plan-before-code.json;
            EDIT_TIME_GUARD_FAILED=artifacts/shoperation-development-guard/edit-time-guard.json;
            INCREMENTAL_REPLAY_FAILED=artifacts/shoperation-development-guard/incremental-replay.json;
            TEST_FAILED=artifacts/test-results.json;
            TYPECHECK_FAILED=artifacts/shoperation-command-diagnostics/template-typecheck.json;
            BUILD_FAILED=artifacts/shoperation-command-diagnostics/template-runtime-build.json;
            FACTORY_QA_RUNTIME_FAILED=artifacts/shoperation-command-diagnostics/template-qa-runtime.json;
            ENGINE_FUNCTIONAL_PREVIEW_FAILED=artifacts/shoperation-command-diagnostics/engine-functional-preview.json;
            ENGINE_FUNCTIONAL_PROOF_FAILED=artifacts/template-engine-functional-proof/proof.json;
            FACTORY_PRODUCT_OWNER_TARGET_FAILED=artifacts/shoperation-command-diagnostics/product-owner-target.json;
          SHOPERATION_TEMPLATE_KEY: "${{ steps.product-owner-target.outputs.template_key || '' }}"
          SHOPERATION_TEMPLATE_VERSION: "${{ steps.product-owner-target.outputs.template_version || '' }}"
          SHOPERATION_TEMPLATE_QUALITY_MANIFEST: artifacts/template-factory-quality/manifest.json
          SHOPERATION_HANDOFF_PROOF: artifacts/template-factory-handoff/proof.json
        run: |
          codes=""
          [ "$KNOWLEDGE_OUTCOME" != "failure" ] || codes="${codes}KNOWLEDGE_PREFLIGHT_FAILED;"
          [ "$DEVELOPMENT_PLAN_OUTCOME" != "failure" ] || codes="${codes}DEVELOPMENT_PLAN_FAILED;"
          [ "$EDIT_GUARD_OUTCOME" != "failure" ] || codes="${codes}EDIT_TIME_GUARD_FAILED;"
          [ "$INCREMENTAL_OUTCOME" != "failure" ] || codes="${codes}INCREMENTAL_REPLAY_FAILED;"
          [ "$CONTRACT_OUTCOME" != "failure" ] || codes="${codes}TEST_FAILED;"
          [ "$TYPECHECK_OUTCOME" != "failure" ] || codes="${codes}TYPECHECK_FAILED;"
          [ "$BUILD_OUTCOME" != "failure" ] || codes="${codes}BUILD_FAILED;"
          [ "$MATRIX_OUTCOME" != "failure" ] || codes="${codes}QUALITY_GATE_FAILED;"
          [ "$QA_RUNTIME_OUTCOME" != "failure" ] || codes="${codes}FACTORY_QA_RUNTIME_FAILED;"
          [ "$RUNTIME_PREVIEW_OUTCOME" != "failure" ] || codes="${codes}ENGINE_FUNCTIONAL_PREVIEW_FAILED;"
          [ "$ENGINE_FUNCTIONAL_OUTCOME" != "failure" ] || codes="${codes}ENGINE_FUNCTIONAL_PROOF_FAILED;"
          [ "$TARGET_OUTCOME" != "failure" ] || codes="${codes}FACTORY_PRODUCT_OWNER_TARGET_FAILED;"
          [ "$HANDOFF_OUTCOME" != "failure" ] || codes="${codes}PRODUCT_OWNER_JOURNEY_FAILED;"
          SHOPERATION_GENERIC_FAILURES="$codes" node scripts/shoperation-failure-intake.mjs

      - name: Upload Template Factory failure intake
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-factory-failure-intake-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/shoperation-failure-intake/**
            artifacts/shoperation-command-diagnostics/**
          if-no-files-found: warn
          retention-days: 90

      - name: Persist unresolved failure intake
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const file='artifacts/shoperation-failure-intake/failure-intake.json';
            if(!fs.existsSync(file))return;
            const report=JSON.parse(fs.readFileSync(file,'utf8'));
            const unresolved=(report.records||[]).filter(r=>['candidate-new-failure','needs-review'].includes(r.classificationStatus));
            if(!unresolved.length)return;
            const open=await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',per_page:100});
            for(const record of unresolved){
              const identity=record.failureFingerprint||record.candidateId;
              const marker=`<!-- shoperation-failure-intake:${identity} -->`;
              if(open.some(issue=>(issue.body||'').includes(marker)))continue;
              await github.rest.issues.create({...context.repo,title:`[Quality intake] ${identity}: ${record.rawErrorCode}`,body:`${marker}\n\nContract: \`shoporation.failure-intake.v2\`\n\nFingerprint: \`${record.failureFingerprint||'unknown'}\`\n\nSource commit: \`${record.sourceCommit||'unknown'}\`\n\nCI run: \`${record.ciRunId||'unknown'}\`\n\nSource: \`${record.failureSource}\`\n\nGate: \`${record.gate||record.gateCode||'unknown'}\`\n\nClassification: \`${record.classificationStatus}\`\n\nReason: ${record.reason||record.symptom}\n\nLocation: ${record.file||record.route||record.endpoint||'not localized'}\n\nThis issue remains open until the failure is matched, promoted, scoped, deduplicated or rejected with an explicit disposition.`});
            }

      - name: Upload QA server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: template-factory-quality-server-log-${{ github.sha }}
          path: /tmp/template-factory-quality-next.log
          if-no-files-found: warn
          retention-days: 14
