name: Template Factory Quality Gate v2
# Quality Gate v2 authority: exact-head proof required.
# Generic roadmap/knowledge-only changes remain under normal CI/Architecture Health.
# Template acceptance always requires a complete valid canonical 14 pages x 3 viewports evidence matrix; reconciled fingerprint-equivalent cases may be reused while canary runs remain regression signals only.

