permissions:
  contents: write
  deployments: read
  statuses: read
  id-token: write

concurrency:
  group: template-factory-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VISUAL_FIDELITY_QA: '1'
      VISUAL_FIDELITY_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TEMPLATE_QUALITY_OUTPUT_DIR: artifacts/template-factory-quality
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund

      - name: Prove stacked PR release risk budget
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: node scripts/release-risk-budget.mjs

      - name: Upload stacked PR release risk budget
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: stacked-release-risk-budget-${{ github.event.pull_request.head.sha }}
          path: artifacts/release-risk-budget.json
          if-no-files-found: error
          retention-days: 30

      - name: Install pinned QA dependencies without changing lock authority
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0 pixelmatch@7.1.0 pngjs@7.0.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install pinned Factory media dependency
        run: python -m pip install --disable-pip-version-check --no-input Pillow==11.3.0

      - name: Materialize internal-reference media pack
        run: >
          python scripts/template-factory-finalize-media.py
          --manifest docs/template-factory-media/loot-vault-v2-finalization.json
          --output-root artifacts/template-factory-finalized-media

      - name: Upload finalized media pack
        uses: actions/upload-artifact@v4
        with:
          name: template-factory-finalized-media-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/template-factory-finalized-media/**
          if-no-files-found: error
          retention-days: 30

      - name: Commit finalized Loot Vault media to PR branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/loot-vault-v2-final-media'
        shell: bash
        run: |
          mkdir -p public/storefront-demo/loot-vault-v2
          cp artifacts/template-factory-finalized-media/public/storefront-demo/loot-vault-v2/*.webp public/storefront-demo/loot-vault-v2/
          git config user.name 'shoperation-template-factory'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/storefront-demo/loot-vault-v2/*.webp
          if git diff --cached --quiet; then
            echo 'Finalized media already matches the branch.'
          else
            git commit -m 'feat: materialize Loot Vault v2 local media'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Run Template Factory contract regressions
        run: >
          npx vitest run
          tests/storefront-template-quality-gate-v2.test.ts
          tests/template-factory-scaffold-v1.test.ts
          tests/template-factory-procedural-memory.test.ts
          tests/template-factory-loot-vault-v2.test.ts
          tests/template-factory-ready-media-files.test.ts
          tests/storefront-template-factory-workflow-coverage.test.ts
          tests/storefront-responsive-isolation.test.ts
          tests/storefront-visual-style-capabilities.test.ts
          tests/storefront-fidelity-typography.test.ts
          tests/storefront-visual-builder-fidelity-operations.test.ts
          tests/storefront-fidelity-layout.test.ts
          tests/storefront-responsive-layout-depth.test.ts
          tests/visual-builder-workspace-ui.test.ts
          tests/roadmap-catchup-foundation.test.ts
          tests/storefront-runtime-backbone.test.tsx
          tests/special-commerce-wave6-cross-engine-acceptance.test.ts
          tests/special-commerce-wave7-template2-adoption.test.ts
          tests/storefront-targeted-page-change.test.ts
          tests/pilot-acceptance-access.test.ts
          tests/storefront-real-route-template-authority.test.ts
          tests/storefront-product-route-authority.test.ts
          tests/storefront-preview-demo-content-routing.test.ts
          tests/storefront-form-wizard-engine.test.ts
          tests/storefront-auth-surface.test.ts
          tests/storefront-auth-intent-checkout.test.ts
          tests/storefront-auth-return-target.test.ts
          tests/storefront-guest-order-claim.test.ts
          tests/storefront-shared-commerce-account-hardening.test.ts
          tests/storefront-public-information-routes.test.ts
          tests/storefront-catalog-discovery-route.test.ts
          tests/customer-account-runtime-hardening.test.ts
          tests/storefront-system-surfaces.test.ts
          tests/storefront-social-settings.test.ts
          tests/storefront-template-preview-runtime.test.ts
          tests/storefront-visual-builder-fidelity-engine.test.ts
          tests/playroom-v20-canonical-shell-content.test.ts
          tests/storefront-playroom-v20-canonical-authority.test.ts
          tests/storefront-playroom-v20-functional-acceptance.test.ts
          tests/storefront-template-route-integrity.test.ts
          tests/storefront-template-demo-content-persistence.test.ts
          tests/storefront-account-capability-navigation.test.tsx
          tests/storefront-commerce-header.test.tsx
          tests/storefront-runtime-primitives.test.tsx
          tests/cart-style-quantity-control.test.tsx

      - name: Typecheck exact head
        run: npm run typecheck

      - name: Build exact-head Runtime
        run: npm run build

      - name: Start exact-head QA Runtime
        shell: bash
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/template-factory-quality-next.log 2>&1 &
          echo $! > /tmp/template-factory-quality-next.pid
          for attempt in $(seq 1 75); do
            if curl --fail --silent --show-error 'http://127.0.0.1:3000/api/visual-fidelity/templates' > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/template-factory-quality-next.log
          exit 1

      - name: Run Template Factory 14x3 browser matrix
        run: node scripts/template-factory-quality-gate.mjs

      - name: Upload Template Factory quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-factory-quality-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/template-factory-quality/*.png
            artifacts/template-factory-quality/manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Resolve exact-head Vercel preview for Product Owner proof
        if: (github.event_name == 'push' && startsWith(github.ref_name, 'feature/template-factory-product-owner-')) || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/template-factory-product-owner-'))
        id: product-owner-preview
        uses: actions/github-script@v7
        with:
          script: |
            const sleep=(ms)=>new Promise(resolve=>setTimeout(resolve,ms));
            const {owner,repo}=context.repo;
            const sha=context.payload.pull_request?.head?.sha??context.sha;
            for(let attempt=0;attempt<90;attempt+=1){
              const deployments=await github.paginate(
                github.rest.repos.listDeployments,
                {owner,repo,sha,per_page:100},
              );
              for(const deployment of deployments){
                const statuses=await github.paginate(
                  github.rest.repos.listDeploymentStatuses,
                  {owner,repo,deployment_id:deployment.id,per_page:100},
                );
                const ready=statuses.find(status=>{
                  if(status.state!=='success'||!status.environment_url)return false;
                  try{return new URL(status.environment_url).hostname.endsWith('.vercel.app')}catch{return false}
                });
                if(ready){
                  core.info(`Exact-head Vercel preview ready for ${sha}.`);
                  core.setOutput('base-url',new URL(ready.environment_url).origin);
                  return;
                }
              }
              const combined=await github.rest.repos.getCombinedStatusForRef({owner,repo,ref:sha});
              const vercel=combined.data.statuses.find(status=>status.context==='Vercel');
              if(vercel&&['failure','error'].includes(vercel.state)){
                throw new Error(`EXACT_HEAD_VERCEL_DEPLOYMENT_${vercel.state.toUpperCase()}`);
              }
              if(vercel?.state==='success'){
                core.info('GitHub deployment status is successful; using the protected proof-branch alias with exact source-commit verification.');
                core.setOutput('base-url','https://water-k-native-git-feature-template-fact-a56b5f-infowaterk-5067.vercel.app');
                return;
              }
              await sleep(5000);
            }
            core.setFailed('EXACT_HEAD_VERCEL_PREVIEW_NOT_READY');

      - name: Mint trusted OIDC token for protected Vercel preview
        if: (github.event_name == 'push' && startsWith(github.ref_name, 'feature/template-factory-product-owner-')) || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/template-factory-product-owner-'))
        id: product-owner-oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token=await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token',token);

      - name: Prove exact-head Product Owner login journey
        if: (github.event_name == 'push' && startsWith(github.ref_name, 'feature/template-factory-product-owner-')) || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/template-factory-product-owner-'))
        env:
          PRODUCT_OWNER_PREVIEW_URL: "${{ steps.product-owner-preview.outputs.base-url }}/storefront-template-preview?template=gaming.loot-vault&version=2&page=home&viewport=desktop&factory=1"
          PRODUCT_OWNER_TEMPLATE_KEY: gaming.loot-vault
          PRODUCT_OWNER_TEMPLATE_VERSION: '2'
          PRODUCT_OWNER_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PRODUCT_OWNER_TEST_EMAIL: ${{ secrets.PRODUCT_OWNER_TEST_EMAIL }}
          PRODUCT_OWNER_TEST_PASSWORD: ${{ secrets.PRODUCT_OWNER_TEST_PASSWORD }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.product-owner-oidc.outputs.token }}
          TEMPLATE_QUALITY_MANIFEST: artifacts/template-factory-quality/manifest.json
          TEMPLATE_HANDOFF_OUTPUT_DIR: artifacts/template-factory-handoff
        run: node scripts/template-factory-product-owner-handoff.mjs

      - name: Upload Product Owner journey proof
        if: always() && (github.event_name == 'push' && startsWith(github.ref_name, 'feature/template-factory-product-owner-')) || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/template-factory-product-owner-'))
        uses: actions/upload-artifact@v4
        with:
          name: template-factory-handoff-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/template-factory-handoff/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload QA server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: template-factory-quality-server-log-${{ github.sha }}
          path: /tmp/template-factory-quality-next.log
          if-no-files-found: warn
          retention-days: 14
