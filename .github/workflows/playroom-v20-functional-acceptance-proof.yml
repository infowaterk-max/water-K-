name: Temporary Playroom v20 functional acceptance proof

on:
  push:
    branches:
      - feature/playroom-v20-functional-acceptance
    paths:
      - src/app/api/internal/playroom-v20-acceptance/route.ts
      - .github/workflows/playroom-v20-functional-acceptance-proof.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://water-k-native-git-feature-playroom-v20-c02349-infowaterk-5067.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Verify Vercel automation bypass secret
        shell: bash
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET repository secret is missing." >&2
            exit 1
          fi

      - name: Run exact-head Playroom v20 functional acceptance
        shell: bash
        run: |
          set -euo pipefail
          rm -f response.json
          for attempt in $(seq 1 50); do
            status="$(curl --silent --show-error               --output response.json               --write-out '%{http_code}'               --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"               --header "x-shoperation-acceptance-proof: $GITHUB_SHA"               "$BASE_URL/api/internal/playroom-v20-acceptance")"

            if [ "$status" = "200" ]; then break; fi
            if [ "$status" = "500" ] || [ "$status" = "409" ]; then
              echo "Acceptance endpoint returned HTTP $status." >&2
              cat response.json >&2 || true
              exit 1
            fi
            if [ "$attempt" -eq 50 ]; then
              echo "Acceptance endpoint did not become ready for exact SHA $GITHUB_SHA; last HTTP $status." >&2
              cat response.json >&2 || true
              exit 1
            fi
            sleep 10
          done

          node <<'NODE'
          const fs=require('node:fs');
          const value=JSON.parse(fs.readFileSync('response.json','utf8'));
          const e=value?.evidence;
          const required=[
            value?.ok===true,
            e?.commit===process.env.GITHUB_SHA,
            e?.environment==='preview-staging',
            e?.support?.firstStatus===201,
            e?.support?.secondStatus===429,
            e?.support?.oneTicket===true,
            e?.newsletter?.firstStatus===201,
            e?.newsletter?.secondStatus===200,
            e?.newsletter?.firstDuplicate===false,
            e?.newsletter?.secondDuplicate===true,
            e?.newsletter?.oneConsent===true,
            e?.storefront?.v19?.pageCount===14,
            e?.storefront?.v19?.publishedCount===0,
            e?.storefront?.v19?.mutationScope==='storefront_page_drafts_only',
            e?.storefront?.v20?.pageCount===14,
            e?.storefront?.v20?.publishedCount===0,
            Array.isArray(e?.storefront?.v20?.revisions)&&e.storefront.v20.revisions.length===14&&e.storefront.v20.revisions.every(x=>x===2),
            e?.storefront?.v20?.mutationScope==='storefront_page_drafts_only',
            e?.boundary?.ordersBefore===e?.boundary?.ordersAfter,
            e?.boundary?.productsBefore===e?.boundary?.productsAfter,
            e?.cleanup?.supportCount===0,
            e?.cleanup?.newsletterCount===0,
            e?.cleanup?.storefrontPageCount===0,
          ];
          if(required.some(result=>result!==true)){
            console.error(JSON.stringify(value,null,2));
            throw new Error('PLAYROOM_V20_FUNCTIONAL_ACCEPTANCE_EVIDENCE_INVALID');
          }
          console.log(JSON.stringify(value,null,2));
          NODE

      - name: Record acceptance evidence
        if: success()
        shell: bash
        run: |
          {
            echo '## Playroom v20 exact-head functional acceptance'
            echo ''
            echo "- Source commit: $GITHUB_SHA"
            echo '- Environment: protected Vercel preview -> staging Supabase'
            echo '- Contact Form success + duplicate: PASS'
            echo '- Newsletter success + idempotent duplicate: PASS'
            echo '- v19 -> v20 draft-only persistence: PASS'
            echo '- Business-data mutation boundary: PASS'
            echo '- Acceptance data cleanup: PASS'
            echo '- Production: untouched'
          } >> "$GITHUB_STEP_SUMMARY"
