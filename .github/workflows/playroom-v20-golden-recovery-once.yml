name: Playroom v20 Accepted Golden Recovery Once

on:
  push:
    branches:
      - fix/playroom-v20-production-golden-baseline
    paths:
      - '.github/workflows/playroom-v20-golden-recovery-once.yml'

permissions:
  actions: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: fix/playroom-v20-production-golden-baseline
          fetch-depth: 0

      - name: Download exact production quality evidence
        uses: actions/download-artifact@v4
        with:
          pattern: template-factory-quality-aff3be1c3099fbe0242a92f1eea5c3ab0d56270b
          path: artifacts/accepted-production-evidence
          merge-multiple: true
          run-id: '35822655683'
          github-token: ${{ github.token }}

      - name: Verify accepted production evidence identity
        shell: bash
        run: |
          test "$(node -p "JSON.parse(require('fs').readFileSync('artifacts/accepted-production-evidence/manifest.json','utf8')).sourceCommit")" = "aff3be1c3099fbe0242a92f1eea5c3ab0d56270b"

      - name: Promote accepted 14x3 Playroom matrix
        run: >
          node scripts/promote-template-golden-baseline.mjs
          artifacts/accepted-production-evidence
          "gaming.playroom"
          "20"
          "tests/visual-baselines/gaming.playroom/v20"
          --allow-golden-drift

      - name: Commit promoted baselines and remove one-shot recovery workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual-baselines/gaming.playroom/v20
          git rm .github/workflows/playroom-v20-golden-recovery-once.yml
          git diff --cached --quiet && { echo "No baseline changes to commit"; exit 1; }
          git commit -m "fix: promote accepted Playroom v20 production golden baseline"
          git push origin HEAD:fix/playroom-v20-production-golden-baseline
