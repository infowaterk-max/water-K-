name: Checkout Golden One Shot

on:
  push:
    branches:
      - fix/playroom-v20-product-completeness
    paths:
      - .github/workflows/checkout-golden-one-shot.yml

permissions:
  actions: read
  contents: write

jobs:
  promote-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transient trigger head
        uses: actions/checkout@v4
        with:
          ref: fix/playroom-v20-product-completeness
          fetch-depth: 2

      - name: Prove transient delta only
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "3094fe9119264b418cd7a3d00c8e1d05be5a8bb5"
          git diff --name-only HEAD^ HEAD > /tmp/transient-files.txt
          test "$(wc -l < /tmp/transient-files.txt | tr -d ' ')" = "1"
          grep -Fx ".github/workflows/checkout-golden-one-shot.yml" /tmp/transient-files.txt

      - name: Download exact Template Factory evidence
        uses: actions/download-artifact@v4
        with:
          pattern: template-factory-quality-*
          path: artifacts/promotable-quality-evidence
          merge-multiple: true
          run-id: 36393239807
          github-token: ${{ github.token }}

      - name: Verify exact evidence source
        shell: bash
        run: |
          test "$(node -p "JSON.parse(require('fs').readFileSync('artifacts/promotable-quality-evidence/manifest.json','utf8')).sourceCommit")" = "3094fe9119264b418cd7a3d00c8e1d05be5a8bb5"

      - name: Promote checkout-only golden scope
        shell: bash
        run: |
          node scripts/promote-template-golden-baseline.mjs \
            artifacts/promotable-quality-evidence \
            gaming.playroom \
            20 \
            tests/visual-baselines/gaming.playroom/v20 \
            --allow-golden-drift \
            --page-types=checkout \
            --viewports=all

      - name: Prove only checkout baselines changed
        shell: bash
        run: |
          git diff --name-only -- tests/visual-baselines/gaming.playroom/v20 | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          tests/visual-baselines/gaming.playroom/v20/checkout-desktop.png
          tests/visual-baselines/gaming.playroom/v20/checkout-mobile.png
          tests/visual-baselines/gaming.playroom/v20/checkout-tablet.png
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit checkout goldens and remove one-shot workflow
        shell: bash
        run: |
          git add \
            tests/visual-baselines/gaming.playroom/v20/checkout-desktop.png \
            tests/visual-baselines/gaming.playroom/v20/checkout-tablet.png \
            tests/visual-baselines/gaming.playroom/v20/checkout-mobile.png
          git rm .github/workflows/checkout-golden-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Golden: promote Playroom checkout baselines [skip ci]"
          git push origin HEAD:refs/heads/fix/playroom-v20-product-completeness
