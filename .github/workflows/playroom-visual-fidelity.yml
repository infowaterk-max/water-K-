name: Playroom Visual Fidelity

on:
  push:
    branches:
      - feature/playroom-reference-fidelity-production-polish
      - fix/playroom-v18-upgrade-path

permissions:
  contents: read

concurrency:
  group: playroom-visual-fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: contains(github.event.head_commit.message, '[playroom-fidelity]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VISUAL_FIDELITY_QA: '1'
      VISUAL_FIDELITY_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned screenshot runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build exact-head Runtime
        run: npm run build
      - name: Start exact-head Runtime
        shell: bash
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/playroom-fidelity-next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error 'http://127.0.0.1:3000/visual-fidelity-qa?template=gaming.playroom&version=18&page=home&viewport=desktop' > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/playroom-fidelity-next.log
          exit 1
      - name: Capture Playroom desktop reference viewport
        run: node scripts/capture-playroom-fidelity.mjs
      - name: Upload Playroom fidelity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playroom-visual-fidelity-${{ github.sha }}
          path: |
            artifacts/playroom-fidelity/*.png
            artifacts/playroom-fidelity/manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload QA server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playroom-visual-fidelity-server-log-${{ github.sha }}
          path: /tmp/playroom-fidelity-next.log
          if-no-files-found: warn
          retention-days: 14
