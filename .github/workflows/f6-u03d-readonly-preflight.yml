name: F6-U03d offline managed dependency and ACL preflight
on:
  push:
    branches:
      - feature/core-1186-f6-u03d-managed-dependency-acl-preflight
    paths:
      - .github/workflows/f6-u03d-readonly-preflight.yml
      - .github/workflows/f6-u03-canonical-plan-capture.yml
      - scripts/shoperation-f6-u03d-managed-preflight.mjs
      - tests/shoperation-f6-u03d-managed-preflight.test.ts
      - docs/po/CORE_1186_F6_U03D_MANAGED_DEPENDENCY_ACL_GATE_2026-10-15.md
      - quality/development/active-plan.json

permissions:
  contents: read

jobs:
  offline-managed-preflight:
    name: Check read-only managed dependency contract with zero database access
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact Git source without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Emit read-only SQL digest and blocked-reset evidence
        shell: bash
        run: |
          mkdir -p artifacts/f6-u03d
          node scripts/shoperation-f6-u03d-managed-preflight.mjs --offline-review > artifacts/f6-u03d/offline-managed-preflight.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('artifacts/f6-u03d/offline-managed-preflight.json','utf8'));
          if(x.decision!=='REVIEW_ONLY'||x.scope!=='READ_ONLY_MANAGED_DEPENDENCY_AND_ACL'
            ||x.resetEligible!==false||x.hostedConnectionUsed!==false
            ||x.actualCustomerMigrationsApplied!==0||x.projectRef!=='istjjkdcvsvilrycqecd')
            throw Error('F6U03D_OFFLINE_PROOF_OVERCLAIM');
          console.log('F6-U03d offline source contract PASS; no Supabase connection or reset.');
          NODE
      - name: Publish limited source-only audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: f6-u03d-offline-readonly-${{ github.sha }}
          path: artifacts/f6-u03d/offline-managed-preflight.json
          if-no-files-found: error
          retention-days: 30
