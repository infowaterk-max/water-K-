name: F6-U03m real local Docker PG17 Office-wide catalog RLS ACL trigger review
on:
  push:
    branches:
      - feature/core-1186-f6-u03m-office-catalog-grant-policy-audit
    paths:
      - scripts/shoperation-f6-u03m-office-catalog-audit.mjs
      - tests/shoperation-f6-u03m-office-catalog-audit.test.ts
      - .github/workflows/f6-u03m-office-catalog-proof.yml
      - docs/po/CORE_1186_F6_U03M_OFFICE_CATALOG_AUDIT_2026-10-16.md
      - quality/development/active-plan.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-pg17-office-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f6-u03m-local-only
          POSTGRES_DB: f6_u03i_fresh
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d f6_u03i_fresh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install source-locked dependencies and real PostgreSQL client
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Verify original 78 source hashes and create READ ONLY native catalog query
        run: |
          node scripts/shoperation-f6-u03k-office-local-replay.mjs --emit-bundle artifacts/f6-u03k/local-77
          node scripts/shoperation-f6-u03m-office-catalog-audit.mjs --emit-readonly artifacts/f6-u03m/office-catalog
          npx vitest run tests/shoperation-f6-u03m-office-catalog-audit.test.ts
      - name: Prove exact local PG17 Docker peer and reject external selector variables
        shell: bash
        env:
          PGPASSWORD: f6-u03m-local-only
          PG17_CONTAINER: ${{ job.services.pg17.id }}
        run: |
          for n in PGHOST PGHOSTADDR PGSERVICE PGSERVICEFILE PGDATABASE PGOPTIONS DATABASE_URL SUPABASE_DB_URL SHOPERATION_FRESH_INSTALL_DB_URL; do
            if printenv "$n" >/dev/null 2>&1; then echo "F6U03M_FORBIDDEN_SELECTOR=$n" >&2; exit 1; fi
          done
          test -n "$PG17_CONTAINER"
          peer="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$PG17_CONTAINER")"
          test -n "$peer"
          actual="$(psql -XAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d f6_u03i_fresh -c "select host(inet_server_addr())||'|'||current_database()||'|'||current_user||'|'||current_setting('server_version_num')")"
          case "$actual" in "$peer|f6_u03i_fresh|postgres|17"????) echo 'Verified Docker PG17 for Office native catalog';; *) echo 'F6U03M_WRONG_DATABASE' >&2; exit 1;; esac
      - name: Execute exactly original 78 SQL migration sources plus original postflight and COMMIT
        env:
          PGPASSWORD: f6-u03m-local-only
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d f6_u03i_fresh -f artifacts/f6-u03k/local-77/bootstrap-fresh.sql >artifacts/f6-u03m/office-catalog/bootstrap.log
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d f6_u03i_fresh -f artifacts/f6-u03k/local-77/commit.sql >artifacts/f6-u03m/office-catalog/commit.log 2>artifacts/f6-u03m/office-catalog/commit.err
          grep -F 'target-preflight-ok' artifacts/f6-u03m/office-catalog/commit.log
          grep -F 'target-postflight-ok' artifacts/f6-u03m/office-catalog/commit.log
          tail -1 artifacts/f6-u03m/office-catalog/commit.log | grep -Fx 'COMMIT'
      - name: Read ALL public/private real catalog objects and classify review findings
        env:
          PGPASSWORD: f6-u03m-local-only
        run: |
          psql -XAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d f6_u03i_fresh -f artifacts/f6-u03m/office-catalog/native-catalog-readonly.sql >artifacts/f6-u03m/office-catalog/raw-native-catalog.json 2>artifacts/f6-u03m/office-catalog/catalog.err
          node scripts/shoperation-f6-u03m-office-catalog-audit.mjs --classify artifacts/f6-u03m/office-catalog
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('artifacts/f6-u03m/office-catalog/office-catalog-review.json','utf8'));
          if(x.decision!=='OFFICE_CATALOG_REVIEW_REQUIRED_NOT_RELEASE'||
             x.releaseAuthorized!==false||x.hostedTouched!==false||
             x.signedInAlapProRlsProven!==false||x.sourceCount!==78||
             x.counts.relations<190||x.counts.functions<379||x.counts.policies<129)
            throw Error('F6U03M_INCOMPLETE_OR_FALSE_GREEN_REVIEW');
          console.log(JSON.stringify({decision:x.decision,counts:x.counts,
             office:x.relevantCounts,reviewFindings:x.findingsCount,
             releaseAuthorized:false},null,2));
          NODE
      - name: Preserve original source and native catalog read-only proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f6-u03m-real-pg17-office-catalog-${{ github.sha }}
          path: |
            artifacts/f6-u03m/office-catalog/source-manifest.json
            artifacts/f6-u03m/office-catalog/native-catalog-readonly.sql
            artifacts/f6-u03m/office-catalog/raw-native-catalog.json
            artifacts/f6-u03m/office-catalog/office-catalog-review.json
            artifacts/f6-u03m/office-catalog/catalog.err
            artifacts/f6-u03m/office-catalog/commit.err
          retention-days: 14
          if-no-files-found: warn
