name: V24 Cloud Smoke

on:
  push:
    branches:
      - core-engine-2-batch
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Exact Vercel deployment URL to smoke-test'
        required: true
        type: string
      environment:
        description: 'Evidence environment'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: v24-cloud-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate automation bypass secret
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET GitHub secret hiányzik." >&2
            exit 1
          fi

      - name: Resolve protected preview target
        env:
          DISPATCH_BASE_URL: ${{ inputs.base_url }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SMOKE_BASE_URL=$DISPATCH_BASE_URL" >> "$GITHUB_ENV"
            echo "DEPLOY_ENVIRONMENT=${{ inputs.environment }}" >> "$GITHUB_ENV"
          else
            echo "SMOKE_BASE_URL=https://water-k-native-git-core-engine-2-batch-infowaterk-5067.vercel.app" >> "$GITHUB_ENV"
            echo "DEPLOY_ENVIRONMENT=preview" >> "$GITHUB_ENV"
          fi
          echo "SMOKE_EXPECTED_SHA=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Run V24 protected cloud smoke
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          for attempt in $(seq 1 20); do
            if node scripts/smoke.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Protected cloud smoke failed after retries." >&2
              exit 1
            fi
            sleep 15
          done
