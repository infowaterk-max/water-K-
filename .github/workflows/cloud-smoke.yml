name: V24 Cloud Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Exact Vercel deployment URL to smoke-test'
        required: true
        type: string
      environment:
        description: 'Evidence environment'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - staging
          - production

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate automation bypass secret
        id: bypass-secret
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET GitHub secret hiányzik." >&2
            exit 1
          fi

      - name: Run V24 protected cloud smoke
        id: cloud-smoke
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
          SMOKE_EXPECTED_SHA: ${{ github.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          for attempt in $(seq 1 20); do
            if SMOKE_ATTEMPT="$attempt" node scripts/smoke.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Protected cloud smoke failed after retries." >&2
              exit 1
            fi
            sleep 15
          done

      - name: Upload Cloud Smoke exact-head evidence
        if: always() && steps.cloud-smoke.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: cloud-smoke-${{ inputs.environment }}-${{ github.sha }}
          path: artifacts/cloud-smoke/smoke.json
          if-no-files-found: error
          retention-days: 90

      - name: Create Cloud Smoke failure intake
        if: always() && (steps.bypass-secret.outcome == 'failure' || steps.cloud-smoke.outcome == 'failure')
        env:
          SHOPERATION_SOURCE_COMMIT: ${{ github.sha }}
          SHOPERATION_FAILURE_SOURCE: cloud-smoke
          SHOPERATION_ENVIRONMENT: ${{ inputs.environment }}
          SHOPERATION_CI_RUN_ID: ${{ github.run_id }}
          SHOPERATION_CI_WORKFLOW: ${{ github.workflow }}
          SHOPERATION_DIAGNOSTIC_ARTIFACTS: CLOUD_SMOKE_FAILED=artifacts/cloud-smoke/smoke.json
          BYPASS_OUTCOME: ${{ steps.bypass-secret.outcome }}
          SMOKE_OUTCOME: ${{ steps.cloud-smoke.outcome }}
        shell: bash
        run: |
          codes=""
          [ "$BYPASS_OUTCOME" != "failure" ] || codes="${codes}CLOUD_SMOKE_SECRET_REQUIRED;"
          [ "$SMOKE_OUTCOME" != "failure" ] || codes="${codes}CLOUD_SMOKE_FAILED;"
          SHOPERATION_GENERIC_FAILURES="$codes" node scripts/shoperation-failure-intake.mjs

      - name: Upload Cloud Smoke failure intake
        if: always() && (steps.bypass-secret.outcome == 'failure' || steps.cloud-smoke.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: cloud-smoke-failure-intake-${{ inputs.environment }}-${{ github.sha }}
          path: artifacts/shoperation-failure-intake/**
          if-no-files-found: error
          retention-days: 90

      - name: Persist unresolved Cloud Smoke failure intake
        if: always() && (steps.bypass-secret.outcome == 'failure' || steps.cloud-smoke.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const file='artifacts/shoperation-failure-intake/failure-intake.json';
            if(!fs.existsSync(file))return;
            const report=JSON.parse(fs.readFileSync(file,'utf8'));
            const unresolved=(report.records||[]).filter(r=>['candidate-new-failure','needs-review'].includes(r.classificationStatus));
            if(!unresolved.length)return;
            const open=await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',per_page:100});
            for(const record of unresolved){
              const identity=record.failureFingerprint||record.candidateId;
              const marker=`<!-- shoperation-failure-intake:${identity} -->`;
              if(open.some(issue=>(issue.body||'').includes(marker)))continue;
              await github.rest.issues.create({...context.repo,title:`[Quality intake] ${identity}: ${record.rawErrorCode}`,body:`${marker}\n\nContract: \`shoporation.failure-intake.v2\`\n\nFingerprint: \`${record.failureFingerprint||'unknown'}\`\n\nSource commit: \`${record.sourceCommit||'unknown'}\`\n\nCI run: \`${record.ciRunId||'unknown'}\`\n\nSource: \`${record.failureSource}\`\n\nGate: \`${record.gate||record.gateCode||'unknown'}\`\n\nClassification: \`${record.classificationStatus}\`\n\nReason: ${record.reason||record.symptom}\n\nLocation: ${record.file||record.route||record.endpoint||'not localized'}\n\nThis issue remains open until the failure is matched, promoted, scoped, deduplicated or rejected with an explicit disposition.`});
            }
