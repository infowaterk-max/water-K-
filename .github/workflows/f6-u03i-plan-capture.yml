name: F6-U03i source-only canonical Development Guard plan
on:
  push:
    branches:
      - feature/core-1186-f6-u03i-local-59-migration-replay
    paths:
      - .github/workflows/f6-u03i-plan-capture.yml
      - quality/development/active-plan.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Canonical Development Guard — source only, no SQL execution
        run: |
          node scripts/shoperation-development-guard.mjs \
            --task "Core #1186 F6-U03i: complete isolated Docker PostgreSQL17 atomic 59-file baseline replay and rollback proof without hosted execution" \
            --files "scripts/shoperation-f6-u03i-local-59-proof.mjs;tests/shoperation-f6-u03i-local-59-proof.test.ts;.github/workflows/f6-u03i-local-59-proof.yml;.github/workflows/f6-u03i-plan-capture.yml;docs/po/CORE_1186_F6_U03I_LOCAL_59_PROOF_2026-10-15.md;quality/development/active-plan.json" \
            --risk critical \
            --source-ref "https://github.com/infowaterk-max/water-K-/pull/1347" \
            --write-plan --check
      - name: Print canonical full guard and plan
        if: always()
        run: |
          cat artifacts/shoperation-development-guard/development-guard.md
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          const file='quality/development/active-plan.json';
          if(existsSync(file)){
            const b=Buffer.from(readFileSync(file)).toString('base64');
            for(let i=0;i<b.length;i+=1200) console.log('F6U03I_PLAN='+b.slice(i,i+1200));
          }
          NODE
      - name: Save guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f6-u03i-plan-source-only-${{ github.sha }}
          path: |
            quality/development/active-plan.json
            artifacts/shoperation-development-guard/development-guard.json
            artifacts/shoperation-development-guard/development-guard.md
          retention-days: 7
