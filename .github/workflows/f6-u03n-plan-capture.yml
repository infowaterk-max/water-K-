name: F6-U03n critical two-tenant role rehearsal plan
on:
  push:
    branches: [feature/core-1186-f6-u03n-local-tenant-role-rehearsal]
    paths:
      - .github/workflows/f6-u03n-plan-capture.yml
      - quality/development/active-plan.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Generate scoped canonical critical Development Guard
        run: |
          node scripts/shoperation-development-guard.mjs \
            --task "Core #1186 F6-U03n: 2-tenant Alap/Pro isolated PG17 JWT-role RLS rehearsal with fail-closed real-provider boundary" \
            --files "scripts/shoperation-f6-u03n-tenant-role-rehearsal.mjs;tests/shoperation-f6-u03n-tenant-role-rehearsal.test.ts;.github/workflows/f6-u03n-local-tenant-rls-proof.yml;.github/workflows/f6-u03n-plan-capture.yml;docs/po/CORE_1186_F6_U03N_LOCAL_TENANT_ROLE_REHEARSAL_2026-10-16.md;quality/development/active-plan.json" \
            --risk critical \
            --source-ref "https://github.com/infowaterk-max/water-K-/issues/1228" \
            --write-plan --check
      - name: Emit plan and known failures for review
        if: always()
        run: |
          cat artifacts/shoperation-development-guard/development-guard.md || :
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          if(existsSync('quality/development/active-plan.json')){
            const s=readFileSync('quality/development/active-plan.json').toString('base64');
            for(let i=0;i<s.length;i+=1200)console.log('F6U03N_PLAN='+s.slice(i,i+1200));
          }
          NODE
      - name: Upload canonical guard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f6-u03n-role-plan-${{ github.sha }}
          path: |
            quality/development/active-plan.json
            artifacts/shoperation-development-guard/development-guard.md
            artifacts/shoperation-development-guard/development-guard.json
          retention-days: 7
